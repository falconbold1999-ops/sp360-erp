<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SP360 ERP v6 — Smart Projects 360</title>
<script src="js/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --n1:#0B1D3A;--n2:#0F2444;--n3:#162E52;--n4:#1A3660;
  --gold:#C9A84C;--goldL:#D4B566;--goldD:#A8873C;
  --green:#10B981;--red:#EF4444;--orange:#F97316;
  --blue:#3B82F6;--violet:#8B5CF6;--cyan:#06B6D4;
  --text:#E2E8F0;--muted:#94A3B8;--faint:#475569;
  --card:#0A1628;--card2:#0D1F38;--bdr:#1E3A5F;
}
body{font-family:'Segoe UI',sans-serif;background:var(--n1);color:var(--text);min-height:100vh}
/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#06112A 0%,#0B1D3A 50%,#0F2444 100%)}
.auth-box{background:var(--n2);border:1px solid var(--bdr);border-radius:18px;padding:44px 40px;width:420px;max-width:95vw;box-shadow:0 24px 80px #00000066}
.auth-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px;justify-content:center}
.auth-logo-sq{width:52px;height:52px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--n1);font-size:20px}
.auth-title{color:var(--gold);font-size:22px;font-weight:800}
.auth-sub{color:var(--muted);font-size:11px;margin-top:3px}
.field{margin-bottom:16px}
.field label{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:11px 14px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--gold)}
.btn-auth{width:100%;background:var(--gold);color:var(--n1);border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px;transition:background .15s}
.btn-auth:hover{background:var(--goldL)}
.btn-auth:disabled{opacity:.6;cursor:not-allowed}
#auth-error{color:var(--red);font-size:12px;margin-top:10px;text-align:center;display:none;background:#EF444418;border:1px solid #EF444433;border-radius:6px;padding:7px}
/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--n2);border-bottom:1px solid var(--bdr);height:56px;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:100;flex-shrink:0}
.logo-sq{width:34px;height:34px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--n1);font-size:14px}
.logo-txt .t1{color:var(--gold);font-weight:800;font-size:14px;line-height:1}
.logo-txt .t2{color:var(--faint);font-size:9px;letter-spacing:1px;text-transform:uppercase}
.hdr-badge{background:#8B5CF622;border:1px solid #8B5CF644;border-radius:7px;padding:3px 11px;color:var(--violet);font-size:11px;font-weight:700}
.av{width:32px;height:32px;border-radius:50%;background:#C9A84C33;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;font-size:11px;flex-shrink:0;border:1px solid #C9A84C44}
.btn-logout{background:none;border:1px solid var(--bdr);border-radius:6px;padding:5px 11px;color:var(--muted);cursor:pointer;font-size:11px;font-family:inherit}
.btn-logout:hover{border-color:var(--red);color:var(--red)}
#layout{display:flex;flex:1;overflow:hidden;min-height:0}
aside{width:192px;flex-shrink:0;background:var(--n2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;transition:width .2s;overflow:hidden}
aside.collapsed{width:0}
nav{padding:10px 7px;flex:1;overflow-y:auto}
.nav-section{color:var(--faint);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:12px 10px 5px}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;border:none;cursor:pointer;background:none;color:var(--muted);font-size:12px;text-align:left;font-family:inherit;border-left:3px solid transparent;margin-bottom:1px;white-space:nowrap;overflow:hidden;transition:all .1s}
.nav-btn.active{background:#C9A84C18;color:var(--gold);font-weight:700;border-left-color:var(--gold)}
.nav-btn:hover:not(.active){background:var(--n4);color:var(--text)}
.nav-icon{font-size:14px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;flex-shrink:0}
.sidebar-foot{padding:10px 14px;border-top:1px solid var(--bdr);font-size:10px;color:var(--faint)}
main{flex:1;overflow-y:auto;padding:20px 24px}
.page{display:none}.page.active{display:block}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-head-left{display:flex;align-items:center;gap:10px}
.page-head h1{font-size:18px;font-weight:800;color:var(--text)}
.page-head .sub{color:var(--faint);font-size:10px;margin-top:3px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.kpi{background:var(--card2);border:1px solid var(--bdr);border-radius:11px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kpi-color,var(--gold))}
.kpi-lbl{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.kpi-val{font-size:24px;font-weight:800;line-height:1;color:var(--kpi-color,var(--text))}
.kpi-sub{color:var(--muted);font-size:10px;margin-top:5px}
.card{background:var(--card2);border:1px solid var(--bdr);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{display:flex;align-items:center;gap:7px;color:var(--goldL);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
table{width:100%;border-collapse:collapse}
th{padding:8px 10px;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bdr);text-align:left;white-space:nowrap}
td{padding:10px 10px;font-size:12px;border-bottom:1px solid #1E3A5F22;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1A366010}
.btn{border:none;border-radius:7px;cursor:pointer;font-weight:700;font-family:inherit;transition:all .1s}
.btn-primary{background:var(--gold);color:var(--n1);padding:8px 16px;font-size:12px}
.btn-primary:hover{background:var(--goldL)}
.btn-ghost{background:none;border:1px solid var(--bdr);color:var(--muted);padding:7px 13px;font-size:11px}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:10px}
.btn-danger{background:#EF444418;border:1px solid #EF444444;color:var(--red);padding:5px 10px;font-size:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--bdr);padding-bottom:10px}
.tab{background:none;border:none;color:var(--muted);padding:6px 14px;font-size:11px;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:600;border-bottom:2px solid transparent;transition:all .1s}
.tab.act{color:var(--gold);border-bottom-color:var(--gold);background:#C9A84C10}
.empty{color:var(--faint);font-size:13px;padding:40px;text-align:center;font-style:italic}
.loading{color:var(--muted);font-size:13px;padding:40px;text-align:center}
.evm-bar-bg{background:var(--n4);border-radius:4px;height:5px;overflow:hidden;width:60px;display:inline-block;vertical-align:middle;margin-left:4px}
.evm-bar-fill{height:100%;border-radius:4px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:#00000088;z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:var(--n2);border:1px solid var(--bdr);border-radius:16px;width:520px;max-width:96vw;max-height:88vh;overflow-y:auto;box-shadow:0 32px 100px #000000AA}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--n2);z-index:1}
.modal-head span{color:var(--gold);font-weight:800;font-size:14px}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:4px}
.modal-close:hover{color:var(--text);background:var(--n4)}
.modal-body{padding:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{margin-bottom:13px}
.form-field label{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:7px;padding:9px 12px;color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border-color .15s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold)}
.form-field select option{background:var(--n2)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--bdr)}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--n2);border:1px solid var(--bdr);border-radius:10px;padding:12px 18px;font-size:13px;z-index:1000;display:none;align-items:center;box-shadow:0 8px 32px #00000066;max-width:340px}
.toast.show{display:flex}
.toast.success{border-color:#10B98155;color:var(--green)}
.toast.error{border-color:#EF444455;color:var(--red)}
/* AUDIT */
.audit-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #1E3A5F22;font-size:11px}
.audit-time{color:var(--muted);white-space:nowrap;min-width:140px}
.audit-action{color:var(--gold);font-weight:700;min-width:80px}
.audit-detail{color:var(--text);flex:1}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid4,.grid2{grid-template-columns:1fr};aside{display:none};main{padding:12px}}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-sq">SP</div>
      <div>
        <div class="auth-title">SP360 ERP v6</div>
        <div class="auth-sub">Smart Projects 360 · Kuwait · Production System</div>
      </div>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your@sp360.com.kw" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn-auth" id="btn-login" onclick="doLogin()">Sign In</button>
    <div id="auth-error">Invalid email or password.</div>
      </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <button onclick="toggleSide()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px;border-radius:5px">☰</button>
    <div class="logo-sq">SP</div>
    <div class="logo-txt"><div class="t1">SP360 ERP v6</div><div class="t2">Smart Projects 360 · Kuwait</div></div>
    <div style="flex:1"></div>
    <div class="hdr-badge" id="pending-badge">⚡ 0 pending</div>
    <div style="display:flex;align-items:center;gap:9px;margin-left:12px">
      <div class="av" id="user-av">?</div>
      <div>
        <div style="font-size:12px;font-weight:700;line-height:1.2" id="user-name">—</div>
        <div style="font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:.3px" id="user-role">—</div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Sign out</button>
    </div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <nav>
        <div class="nav-section">Executive</div>
        <button class="nav-btn active" onclick="navTo('dashboard',this)"><span class="nav-icon">📊</span>Dashboard</button>
        <div class="nav-section">Business</div>
        <button class="nav-btn" id="nav-bizdev" onclick="navTo('bizdev',this)"><span class="nav-icon">🎯</span>Business Dev</button>
        <button class="nav-btn" id="nav-projects" onclick="navTo('projects',this)"><span class="nav-icon">🏗</span>Projects</button>
        <div class="nav-section">Operations</div>
        <button class="nav-btn" id="nav-procurement" onclick="navTo('procurement',this)"><span class="nav-icon">📦</span>Procurement</button>
        <button class="nav-btn" id="nav-finance" onclick="navTo('finance',this)"><span class="nav-icon">💰</span>Finance</button>
        <button class="nav-btn" id="nav-hr" onclick="navTo('hr',this)"><span class="nav-icon">👥</span>HR</button>
        <div class="nav-section">Quality</div>
        <button class="nav-btn" id="nav-qhse" onclick="navTo('qhse',this)"><span class="nav-icon">🛡</span>QHSE</button>
        <button class="nav-btn" id="nav-documents" onclick="navTo('documents',this)"><span class="nav-icon">📄</span>Doc Control</button>
        <div class="nav-section">System</div>
        <button class="nav-btn" id="nav-workflow" onclick="navTo('workflow',this)"><span class="nav-icon">⚡</span>Workflow<span class="nav-badge" id="wf-badge" style="display:none">0</span></button>
        <button class="nav-btn" id="nav-audit" onclick="navTo('audit',this)"><span class="nav-icon">📋</span>Audit Trail</button>
      </nav>
      <div class="sidebar-foot">SP360 ERP v6.0 · Production</div>
    </aside>

    <main>
      <div class="page active" id="page-dashboard"></div>
      <div class="page" id="page-bizdev"></div>
      <div class="page" id="page-projects"></div>
      <div class="page" id="page-procurement"></div>
      <div class="page" id="page-finance"></div>
      <div class="page" id="page-hr"></div>
      <div class="page" id="page-qhse"></div>
      <div class="page" id="page-documents"></div>
      <div class="page" id="page-workflow"></div>
      <div class="page" id="page-audit"></div>
    </main>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><span id="modal-title"></span><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

'use strict';

// ═══════════════════════════════════════════════════════════
//  SP360 ERP v6 — Supabase Production System
// ═══════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://sqizirpsatofcoqshwer.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNxaXppcnBzYXRvZmNvcXNod2VyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTM5MTAsImV4cCI6MjEwMjcyOTkxMH0.LnfA4pGIbv30uQVNHa7MeFioP9OF2ukNTol_cDUF8mk';
// ── SUPABASE INIT (safe, non-blocking) ───────────────────────
let sb;
try {
  const _sb = window.supabase || supabase;
  if (_sb && typeof _sb.createClient === 'function') {
    sb = _sb.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else {
    throw new Error('createClient not found');
  }
} catch(e) {
  console.error('Supabase init error:', e);
  // Show error banner but KEEP login form functional
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#EF4444;color:#fff;text-align:center;padding:8px;font-size:12px;z-index:9999';
  banner.textContent = '⚠️ Connection error — login may not work. Check your network.';
  document.body.prepend(banner);
  // Create a stub so the page doesn't crash
  sb = { auth: { getSession: async()=>({data:{session:null},error:null}), signInWithPassword: async()=>({data:null,error:{message:'Service unavailable'}}), signOut: async()=>{}, onAuthStateChange: ()=>({data:{subscription:{unsubscribe:()=>{}}}}) }, from: ()=>({ select:()=>({eq:()=>({single:()=>Promise.resolve({data:null,error:null})}),in:()=>Promise.resolve({data:[],error:null}),order:()=>({limit:()=>Promise.resolve({data:[],error:null})})}), insert:()=>Promise.resolve({data:null,error:null}), update:()=>({eq:()=>Promise.resolve({data:null,error:null})}), delete:()=>({eq:()=>Promise.resolve({data:null,error:null})}) }) };
}

// ── ROLE-BASED ACCESS ────────────────────────────────────────
const ROLE_PAGES = {
  'PMO Manager':       ['dashboard','bizdev','projects','procurement','finance','hr','qhse','documents','workflow','audit'],
  'Finance Manager':   ['dashboard','projects','procurement','finance','workflow','audit'],
  'Procurement Lead':  ['dashboard','projects','procurement','workflow'],
  'BD Manager':        ['dashboard','bizdev','projects'],
  'QHSE Engineer':     ['dashboard','projects','qhse','documents']
};

// ── WORKFLOW APPROVAL RULES ──────────────────────────────────
// Segregation of Duties — each role approves only their step
const STEP_APPROVERS = {
  'Dept. Approval':    ['PMO Manager','Procurement Lead'],
  'Finance Review':    ['Finance Manager'],
  'GM Approval':       ['PMO Manager'],
  'PM Verification':   ['PMO Manager'],
  'Finance Approval':  ['Finance Manager']
};

let currentUser = null;
let currentProfile = null;
let curProcTab = 'vendors';
let curHRTab = 'employees';
let curQHSETab = 'ncrs';
let curDocTab = 'documents';

// ── UTILS ────────────────────────────────────────────────────
const SC = {
  active:'#10B981',planning:'#3B82F6',on_hold:'#F97316',completed:'#94A3B8',cancelled:'#EF4444',
  draft:'#94A3B8',submitted:'#3B82F6',approved:'#10B981',paid:'#10B981',issued:'#10B981',
  rejected:'#EF4444',under_review:'#F97316',returned:'#F97316',
  open:'#EF4444',closed:'#10B981',in_progress:'#F97316',answered:'#10B981',
  dept_approval:'#F97316',finance_approval:'#8B5CF6',gm_approval:'#06B6D4',
  pending:'#F97316',overdue:'#EF4444',awarded:'#10B981',
  minor:'#3B82F6',major:'#F97316',critical:'#EF4444',
  identified:'#94A3B8',proposal:'#3B82F6',negotiation:'#8B5CF6',won:'#10B981',lost:'#EF4444',
  good:'#10B981',partial:'#F97316',damaged:'#EF4444',blacklisted:'#EF4444',
  annual:'#3B82F6',sick:'#F97316',near_miss:'#F97316',first_aid:'#EF4444',
  'PMO Manager':'#C9A84C','Finance Manager':'#10B981','Procurement Lead':'#3B82F6',
  'BD Manager':'#8B5CF6','QHSE Engineer':'#EF4444'
};
const fmtK = v=>{v=Number(v||0);if(v>=1e6)return(v/1e6).toFixed(2)+'M';if(v>=1e3)return(v/1e3).toFixed(0)+'K';return v.toFixed(0)};
const fmtKWD = v=>'KWD '+fmtK(v);
const pill = (v,c)=>{const col=c||SC[v]||'#94A3B8';return`<span class="pill" style="color:${col};background:${col}22;border:1px solid ${col}44">${String(v||'').replace(/_/g,' ')}</span>`};
const kpi = (lbl,val,c,sub)=>`<div class="kpi" style="--kpi-color:${c||'#C9A84C'}"><div class="kpi-lbl">${lbl}</div><div class="kpi-val">${val}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;
const cpiColor = v=>Number(v)>=1?'#10B981':Number(v)>=0.9?'#F97316':'#EF4444';
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let _toastT;
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  if(_toastT)clearTimeout(_toastT);
  t.textContent=msg;t.className=`toast show ${type}`;
  _toastT=setTimeout(()=>{t.className='toast';},3500);
}

async function writeAudit(entity_type,entity_id,action,old_val,new_val,notes=''){
  try{
    await sb.from('audit_log').insert({
      entity_type,entity_id,action,
      old_values:old_val?JSON.stringify(old_val):null,
      new_values:new_val?JSON.stringify(new_val):null,
      performed_by:currentProfile?.id,
      notes
    });
  }catch(e){console.warn('Audit write failed:',e);}
}

// ── AUTH ─────────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  const errEl=document.getElementById('auth-error');
  const btn=document.getElementById('btn-login');
  errEl.style.display='none';
  if(!email||!pass){errEl.textContent='Email and password required.';errEl.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false;btn.textContent='Sign In';
  if(error){errEl.textContent='Invalid email or password.';errEl.style.display='block';return;}
  currentUser=data.user;
  await loadProfile();
  enterApp();
}

async function loadProfile(){
  try{
    const {data,error}=await sb.from('user_profiles').select('*').eq('id',currentUser.id).single();
    if(error) console.warn('Profile error:',error.message);
    currentProfile=data;
    if(data){
      document.getElementById('user-av').textContent=data.initials||'?';
      document.getElementById('user-av').style.background=data.color+'33';
      document.getElementById('user-av').style.color=data.color;
      document.getElementById('user-name').textContent=data.full_name;
      document.getElementById('user-role').textContent=data.role;
    } else {
      // Fallback - show email initial
      const initial=(currentUser.email||'U')[0].toUpperCase();
      document.getElementById('user-av').textContent=initial;
      document.getElementById('user-name').textContent=currentUser.email||'User';
      document.getElementById('user-role').textContent='Staff';
      // Create minimal profile so pages load
      currentProfile={id:currentUser.id,role:'PMO Manager',full_name:currentUser.email};
    }
  }catch(e){
    console.warn('Profile load failed:',e);
    currentProfile={id:currentUser.id,role:'PMO Manager',full_name:currentUser.email||'User'};
  }
}

function enterApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  // Show/hide nav based on role
  const allowed=ROLE_PAGES[currentProfile?.role]||['dashboard'];
  ['bizdev','projects','procurement','finance','hr','qhse','documents','workflow','audit'].forEach(p=>{
    const btn=document.getElementById('nav-'+p);
    if(btn)btn.style.display=allowed.includes(p)?'':'none';
  });
  navTo('dashboard',document.querySelector('.nav-btn.active'));
  loadWfBadge();
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser=null;currentProfile=null;
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('login-email').value='';
  document.getElementById('login-pass').value='';
}

async function loadWfBadge(){
  const {data}=await sb.from('workflow_items').select('id').in('status',['pending','overdue']);
  const count=(data||[]).length;
  document.getElementById('pending-badge').textContent=`⚡ ${count} pending`;
  const badge=document.getElementById('wf-badge');
  badge.style.display=count>0?'':'none';
  badge.textContent=count;
}

// ── NAVIGATION ───────────────────────────────────────────────
function toggleSide(){document.getElementById('sidebar').classList.toggle('collapsed');}
function navTo(id,btn){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const pg=document.getElementById('page-'+id);
  if(pg)pg.classList.add('active');
  const loaders={
    dashboard:loadDashboard,bizdev:loadBizdev,projects:loadProjects,
    procurement:()=>loadProc(curProcTab),finance:loadFinance,
    hr:()=>loadHR(curHRTab),qhse:()=>loadQHSE(curQHSETab),
    documents:()=>loadDocs(curDocTab),workflow:loadWorkflow,audit:loadAudit
  };
  if(loaders[id])loaders[id]();
}

// ── MODAL ────────────────────────────────────────────────────
function openModal(title,html){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}

async function wfApprove(wfId,entityType,entityId,currentStep){
  // Determine next step and status change
  const POsteps={'Dept. Approval':'finance_approval','Finance Review':'gm_approval','GM Approval':'issued'};
  const INVsteps={'PM Verification':'Finance Approval','Finance Approval':'completed'};

  if(entityType==='po'){
    const newStatus=POsteps[currentStep];
    const nextStep=Object.keys(POsteps).find(k=>POsteps[k]===newStatus);
    // Update PO status
    const {data:po}=await sb.from('purchase_orders').select('*').eq('id',entityId).single();
    await sb.from('purchase_orders').update({status:newStatus}).eq('id',entityId);
    if(newStatus==='issued'){
      // Close workflow
      await sb.from('workflow_items').update({status:'completed',approved_by:currentProfile.id,approved_date:new Date().toISOString()}).eq('id',wfId);
    } else {
      // Advance to next step
      await sb.from('workflow_items').update({current_step:nextStep,status:'pending'}).eq('id',wfId);
    }
    await writeAudit('purchase_orders',entityId,'APPROVED',{status:po?.status},{status:newStatus},`Workflow step: ${currentStep} → ${newStatus}`);
  } else {
    const newStep=INVsteps[currentStep];
    if(newStep==='completed'){
      const {data:inv}=await sb.from('invoices').select('*').eq('id',entityId).single();
      await sb.from('invoices').update({status:'approved'}).eq('id',entityId);
      await sb.from('workflow_items').update({status:'completed',approved_by:currentProfile.id,approved_date:new Date().toISOString()}).eq('id',wfId);
      await writeAudit('invoices',entityId,'APPROVED',{status:inv?.status},{status:'approved'},`Finance approval completed`);
    } else {
      await sb.from('workflow_items').update({current_step:newStep,status:'pending'}).eq('id',wfId);
    }
  }
  showToast('Approved successfully');
  loadWfBadge();
  loadWorkflow();
}

async function wfReturn(wfId,entityType,entityId){
  const reason=prompt('Reason for return:');
  if(!reason)return;
  if(entityType==='po'){
    const {data:po}=await sb.from('purchase_orders').select('status').eq('id',entityId).single();
    await sb.from('purchase_orders').update({status:'rejected'}).eq('id',entityId);
    await writeAudit('purchase_orders',entityId,'REJECTED',{status:po?.status},{status:'rejected'},reason);
  } else {
    const {data:inv}=await sb.from('invoices').select('status').eq('id',entityId).single();
    await sb.from('invoices').update({status:'returned'}).eq('id',entityId);
    await writeAudit('invoices',entityId,'RETURNED',{status:inv?.status},{status:'returned'},reason);
  }
  await sb.from('workflow_items').update({status:'rejected',reject_reason:reason}).eq('id',wfId);
  showToast('Returned to originator','error');
  loadWfBadge();
  loadWorkflow();
}

    <div class="sec-head"><div class="sec-title"><span>📋</span>System Activity Log</div></div>

}

async function saveOpp(){

  // Generate opp_no
  const {data:last}=await sb.from('opportunities').select('opp_no').order('created_at',{ascending:false}).limit(1).single();
  const year=new Date().getFullYear();
  const seq=last?String(Number(last.opp_no.split('-')[2])+1).padStart(3,'0'):'001';
  const opp_no=`BD-${year}-${seq}`;
  const {error}=await sb.from('opportunities').insert({
    opp_no,title,client,
    department:document.getElementById('f-dept').value,
    est_value:Number(document.getElementById('f-value').value)||0,
    probability:Number(document.getElementById('f-prob').value)||50,
    status:'identified',
    deadline:document.getElementById('f-deadline').value||null,
    notes:document.getElementById('f-notes').value||null,
    created_by:currentProfile?.id
  });
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('opportunities',null,'CREATED',null,{opp_no,title},'New opportunity');
  showToast('Opportunity created');
  closeModal();loadBizdev();
}

async function saveProject(){

  const dept=document.getElementById('f-pdept').value;
  const deptCode={Security:'SEC','AV/Broadcast':'AV',IT:'IT',Power:'PW',Civil:'CV',Wireless:'WL',Trading:'TR'}[dept]||'XX';
  const year=new Date().getFullYear();
  const {data:last}=await sb.from('projects').select('project_no').ilike('project_no',`SP360-${deptCode}-%`).order('project_no',{ascending:false}).limit(1).single();
  const seq=last?String(Number(last.project_no.split('-')[2])+1).padStart(3,'0'):'001';
  const project_no=`SP360-${deptCode}-${seq}`;
  const {data:proj,error}=await sb.from('projects').insert({
    project_no,name,client,department:dept,
    contract_value:val,bac:val,ac:0,ev:0,pv:0,pct:0,cpi:1,spi:1,
    status:'planning',
    priority:document.getElementById('f-ppriority').value,

    end_date:document.getElementById('f-pend').value||null,

}

function openNewInvoiceModal(){
  sb.from('projects').select('id,project_no').order('project_no').then(({data:projs})=>{
    openModal('New Invoice',`
    <div class="form-row">
      <div class="form-field"><label>Project *</label><select id="f-iproj"><option value="">— Select —</option>${(projs||[]).map(p=>`<option value="${p.id}">${esc(p.project_no)}</option>`).join('')}</select></div>
      <div class="form-field"><label>Type</label><select id="f-itype"><option value="client">Client</option><option value="supplier">Supplier</option><option value="subcontractor">Subcontractor</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>Gross Amount (KWD) *</label><input id="f-igross" type="number" placeholder="0"/></div>

    </div>
    <div class="form-row">
      <div class="form-field"><label>Invoice Date *</label><input id="f-idate" type="date"/></div>
      <div class="form-field"><label>Due Date</label><input id="f-idue" type="date"/></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveInvoice()">Create Invoice</button>

async function saveInvoice(){
  const proj=document.getElementById('f-iproj').value;
  const gross=Number(document.getElementById('f-igross').value)||0;
  const date=document.getElementById('f-idate').value;
  if(!proj||!gross||!date){showToast('Project, Amount and Date required','error');return;}
  const ret=Number(document.getElementById('f-iret').value)||0;
  const retAmt=Math.round(gross*ret/100*1000)/1000;
  const net=gross-retAmt;
  const type=document.getElementById('f-itype').value;
  const prefix=type==='client'?'INV-C':type==='supplier'?'INV-S':'INV-SC';
  const year=new Date().getFullYear();
  const {data:last}=await sb.from('invoices').select('invoice_no').ilike('invoice_no',`${prefix}-${year}-%`).order('invoice_no',{ascending:false}).limit(1).single();
  const seq=last?String(Number(last.invoice_no.split('-').pop())+1).padStart(3,'0'):'001';
  const invoice_no=`${prefix}-${year}-${seq}`;
  const {data:inv,error}=await sb.from('invoices').insert({
    invoice_no,project_id:proj,invoice_type:type,
    gross_amount:gross,vat_pct:0,vat_amount:0,
    retention_pct:ret,retention_amt:retAmt,net_amount:net,
    status:'draft',invoice_date:date,
    due_date:document.getElementById('f-idue').value||null,
    created_by:currentProfile?.id
  }).select().single();
  if(error){showToast('Error: '+error.message,'error');return;}
  // Auto-create workflow for non-draft invoices when submitted
  await writeAudit('invoices',inv?.id,'CREATED',null,{invoice_no,gross_amount:gross,net_amount:net,status:'draft'},'New invoice created');
  showToast('Invoice created — submit to trigger approval workflow');
  closeModal();loadFinance();
}

// ── SESSION RESTORE (with timeout) ──────────────────────────
(async()=>{
  try {
    const sessionPromise = sb.auth.getSession();
    const timeoutPromise = new Promise(resolve => setTimeout(() => resolve({data:{session:null},error:{message:'timeout'}}), 5000));
    const {data:{session}, error} = await Promise.race([sessionPromise, timeoutPromise]);
    if (error) console.warn('Session restore:', error.message);
    if (session) {
      currentUser = session.user;
      await loadProfile();
      enterApp();
    }
    // If no session or timeout: auth-screen stays visible (already shown by CSS)
  } catch(e) {
    console.warn('Session restore failed:', e);
    // Auth screen stays visible — user can still log in
  }
})();

sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_OUT'||!session){
    currentUser=null;currentProfile=null;
    if(document.getElementById('app').style.display!=='none') location.reload();
  } else if(session){
    currentUser=session.user;
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('auth-screen').style.display!=='none')doLogin();
});
