// ── CEO FLASH REPORT → PDF ───────────────────────────────────
async function exportCEOPDF(){
  showToast('Generating CEO PDF…');
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const month=new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const today=new Date().toLocaleDateString('en-GB');
  const navy=[30,58,95], gold=[201,168,76], white=[255,255,255];
  const green=[16,185,129], red=[239,68,68], amber=[249,115,22];
  const lgray=[248,250,252];

  // Header
  doc.setFillColor(...navy); doc.rect(0,0,297,22,'F');
  doc.setTextColor(...gold); doc.setFontSize(16); doc.setFont('helvetica','bold');
  doc.text('SP360 ERP v1.8 — CEO Flash Report',14,10);
  doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(...white);
  doc.text(`${month}  ·  Smart Projects 360  ·  Kuwait  ·  Confidential`,14,17);
  doc.text(`Generated: ${today}`,250,17);

  const [projR,invR,wfR,ncrR,bvR]=await Promise.all([
    sb.from('projects').select('*'),
    sb.from('invoices').select('*'),
    sb.from('workflow_items').select('id,status'),
    sb.from('ncrs').select('id,severity,status'),
    sb.from('v_baseline_vs_actual').select('*')
  ]);
  const projs=projR.data||[], invs=invR.data||[];
  const wfs=wfR.data||[], ncrs=ncrR.data||[], bvData=bvR.data||[];

  const totEV=projs.reduce((s,p)=>s+Number(p.ev),0);
  const totAC=projs.reduce((s,p)=>s+Number(p.ac),0);
  const totPV=projs.reduce((s,p)=>s+Number(p.pv),0);
  const totBAC=projs.reduce((s,p)=>s+Number(p.bac),0);
  const portCPI=totAC>0?(totEV/totAC).toFixed(2):'1.00';
  const portSPI=totPV>0?(totEV/totPV).toFixed(2):'1.00';
  const totEAC=projs.reduce((s,p)=>{const eac=Number(p.cpi)>0?Number(p.ac)+(Number(p.bac)-Number(p.ev))/Number(p.cpi):Number(p.bac);return s+eac;},0);
  const totVAC=totBAC-totEAC;
  const rev=invs.filter(i=>i.invoice_type==='client'&&i.status==='paid').reduce((s,i)=>s+Number(i.net_amount),0);
  const cost=invs.filter(i=>i.invoice_type!=='client'&&i.status==='paid').reduce((s,i)=>s+Number(i.net_amount),0);
  const outstanding=invs.filter(i=>i.status!=='paid'&&i.status!=='cancelled').reduce((s,i)=>s+Number(i.net_amount),0);

  // RAG boxes
  const ragItems=[['Schedule',portSPI],['Cost',portCPI],
    ['Quality',ncrs.filter(n=>n.status==='open').length===0?1:ncrs.filter(n=>n.severity==='critical'&&n.status==='open').length>0?0.7:0.9],
    ['Cashflow',outstanding>rev*0.5?0.7:0.9]];
  let rx=14;
  ragItems.forEach(([lbl,val])=>{
    const col=Number(val)>=1?green:Number(val)>=0.9?amber:red;
    doc.setFillColor(...col); doc.roundedRect(rx,25,62,18,2,2,'F');
    doc.setTextColor(...white); doc.setFontSize(7); doc.setFont('helvetica','bold');
    doc.text(Number(val)>=1?'ON TRACK':Number(val)>=0.9?'AT RISK':'CRITICAL',rx+31,32,{align:'center'});
    doc.setFontSize(6); doc.setFont('helvetica','normal');
    doc.text(lbl,rx+31,38,{align:'center'}); rx+=66;
  });

  // Portfolio TCPI for PDF
  const pdfWrem=totBAC-totEV, pdfBudgRem=totBAC-totAC;
  const pdfTCPI=pdfWrem>0&&pdfBudgRem>0?(pdfWrem/pdfBudgRem).toFixed(3):'—';
  const pdfETC=Math.max(totEAC-totAC,0);
  // KPI band — 8 items across 269mm
  const kpis=[['Active',projs.filter(p=>p.status!=='completed').length],
    ['CPI',portCPI],['SPI',portSPI],['TCPI',pdfTCPI],
    ['BAC','KWD '+fmtK(totBAC)],['EAC','KWD '+fmtK(totEAC)],
    ['ETC','KWD '+fmtK(pdfETC)],
    ['VAC',(totVAC>=0?'+':'')+'KWD '+fmtK(Math.abs(totVAC))]];
  doc.setFillColor(...lgray); doc.rect(14,46,269,14,'F');
  let kx=14;
  const kpiW=269/8;
  kpis.forEach(([lbl,val])=>{
    doc.setTextColor(100,100,100); doc.setFontSize(5.5); doc.setFont('helvetica','normal');
    doc.text(lbl,kx+kpiW/2,51,{align:'center'});
    doc.setTextColor(...navy); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    doc.text(String(val),kx+kpiW/2,57,{align:'center'}); kx+=kpiW;
  });

  // EVM Table
  doc.setTextColor(...navy); doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text('PORTFOLIO EVM SUMMARY',14,68);
  const evmHead=[['Project','Client','Phase','%','CPI','SPI','EAC','ETC','VAC','TCPI','RAG']];
  const evmBody=projs.filter(p=>p.status!=='completed').map(p=>{
    const bP=Number(p.bac)||0, aP=Number(p.ac)||0, eP=Number(p.ev)||0;
    const cP=Number(p.cpi)||1;
    const eac=cP>0?aP+(bP-eP)/cP:bP;
    const etc=Math.max(eac-aP,0);
    const vac=bP-eac;
    const wrP=bP-eP, brP=bP-aP;
    const tcpiP=wrP>0&&brP>0?(wrP/brP).toFixed(2):'—';
    const rv=Math.min(Number(p.cpi),Number(p.spi));
    return[p.name?.split('—')[0]?.trim()?.substring(0,26)||'',p.client?.substring(0,14)||'',
      p.status||'',p.pct+'%',Number(p.cpi).toFixed(2),Number(p.spi).toFixed(2),
      'KWD '+fmtK(eac),'KWD '+fmtK(etc),
      (vac>=0?'+':'')+'KWD '+fmtK(Math.abs(vac)),
      tcpiP,
      rv>=1?'Green':rv>=0.9?'Amber':'Red'];
  });
  doc.autoTable({head:evmHead,body:evmBody,startY:71,
    styles:{fontSize:6.5,cellPadding:1.2,textColor:navy},
    headStyles:{fillColor:navy,textColor:white,fontStyle:'bold',fontSize:6.5},
    alternateRowStyles:{fillColor:lgray},
    columnStyles:{0:{cellWidth:36},1:{cellWidth:22},2:{cellWidth:16},3:{cellWidth:9,halign:'center'},
      4:{cellWidth:11,halign:'center'},5:{cellWidth:11,halign:'center'},
      6:{cellWidth:22,halign:'right'},7:{cellWidth:20,halign:'right'},
      8:{cellWidth:20,halign:'right'},9:{cellWidth:11,halign:'center'},10:{cellWidth:11,halign:'center'}},
    margin:{left:14,right:14}});

  // Page 2 — Baseline + Finance
  doc.addPage();
  doc.setFillColor(...navy); doc.rect(0,0,297,14,'F');
  doc.setTextColor(...gold); doc.setFontSize(12); doc.setFont('helvetica','bold');
  doc.text('Baseline vs Actual  ·  Financial Snapshot',14,10);

  const bvHead=[['Project','Baseline','Baseline BAC','Current BAC','BAC Δ','SPI','CPI','SV','CV','%']];
  const bvBody=(bvData||[]).map(r=>{
    const bv=Number(r.bac_variance)||0;
    return[r.project_name?.substring(0,30)||'',r.baseline_version||'',
      'KWD '+fmtK(r.baseline_bac||0),'KWD '+fmtK(r.current_bac||0),
      (bv>=0?'+':'')+fmtK(bv),
      Number(r.spi||0).toFixed(3),Number(r.cpi||0).toFixed(3),
      (Number(r.sv||0)>=0?'+':'')+fmtK(r.sv||0),
      (Number(r.cv||0)>=0?'+':'')+fmtK(r.cv||0),(r.progress_pct||0)+'%'];
  });
  doc.autoTable({head:bvHead,body:bvBody,startY:18,
    styles:{fontSize:7,cellPadding:1.5,textColor:navy},
    headStyles:{fillColor:navy,textColor:white,fontStyle:'bold'},
    alternateRowStyles:{fillColor:lgray},margin:{left:14,right:14}});

  const finY=doc.lastAutoTable.finalY+8;
  doc.setTextColor(...navy); doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text('FINANCIAL SNAPSHOT',14,finY);
  const finItems=[['Revenue Collected','KWD '+fmtK(rev),green],['Cost Paid','KWD '+fmtK(cost),red],
    ['Gross Profit','KWD '+fmtK(rev-cost)+' ('+(rev>0?((rev-cost)/rev*100).toFixed(1):0)+'%)',gold],
    ['Outstanding AR','KWD '+fmtK(outstanding),amber],
    ['Pending WF',wfs.filter(w=>w.status==='pending'||w.status==='overdue').length,amber],
    ['Open NCRs',ncrs.filter(n=>n.status==='open').length,red]];
  let fx=14;
  finItems.forEach(([lbl,val,col])=>{
    doc.setFillColor(...lgray); doc.roundedRect(fx,finY+3,44,14,1,1,'F');
    doc.setTextColor(100,100,100); doc.setFontSize(6); doc.setFont('helvetica','normal');
    doc.text(lbl,fx+22,finY+8,{align:'center'});
    doc.setTextColor(...col); doc.setFontSize(8); doc.setFont('helvetica','bold');
    doc.text(String(val),fx+22,finY+14,{align:'center'}); fx+=47;
  });

  // Footers
  const pageCount=doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFillColor(...navy); doc.rect(0,200,297,10,'F');
    doc.setTextColor(...white); doc.setFontSize(6); doc.setFont('helvetica','normal');
    doc.text(`SP360 ERP v1.8  ·  CEO Flash Report  ·  ${month}  ·  Confidential — For Internal Use Only`,14,206);
    doc.text(`Page ${i} of ${pageCount}`,283,206,{align:'right'});
  }

  doc.save(`SP360_CEO_Flash_Report_${new Date().toISOString().split('T')[0]}.pdf`);
  showToast('CEO PDF exported ✓');
}

// ── SESSION RESTORE ─────────────────────────────────────────
// SP360 ERP: always require explicit login — no auto session restore
// Security policy: every page open must authenticate from scratch
(async()=>{
  try{
    // Clear any existing session — forces login screen every time
    await sb.auth.signOut({ scope: 'local' }).catch(()=>{});
  }catch(e){}
  // Always show login screen
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
})();

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('auth-screen').style.display!=='none')doLogin();
  if(e.key==='?'&&e.shiftKey&&document.getElementById('app').style.display!=='none')openAboutModal();
  if(e.key==='Escape')closeModal();
});

</script>
