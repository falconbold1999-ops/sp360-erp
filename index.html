<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --n1:#0B1D3A;--n2:#0F2444;--n3:#162E52;--n4:#1A3660;
  --gold:#C9A84C;--goldL:#D4B566;--goldD:#A8873C;
  --green:#10B981;--red:#EF4444;--orange:#F97316;
  --blue:#3B82F6;--violet:#8B5CF6;--cyan:#06B6D4;
  --text:#E2E8F0;--muted:#94A3B8;--faint:#475569;
  --card:#0A1628;--card2:#0D1F38;--bdr:#1E3A5F;
}
body{font-family:'Segoe UI',sans-serif;background:var(--n1);color:var(--text);min-height:100vh}
/* AUTH */
#auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#06112A 0%,#0B1D3A 50%,#0F2444 100%)}
.auth-box{background:var(--n2);border:1px solid var(--bdr);border-radius:18px;padding:44px 40px;width:420px;max-width:95vw;box-shadow:0 24px 80px #00000066}
.auth-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px;justify-content:center}
.auth-logo-sq{width:52px;height:52px;border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--n1);font-size:20px}
.auth-title{color:var(--gold);font-size:22px;font-weight:800}
.auth-sub{color:var(--muted);font-size:11px;margin-top:3px}
.field{margin-bottom:16px}
.field label{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:11px 14px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--gold)}
.btn-auth{width:100%;background:var(--gold);color:var(--n1);border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px;transition:background .15s}
.btn-auth:hover{background:var(--goldL)}
.btn-auth:disabled{opacity:.6;cursor:not-allowed}
#auth-error{color:var(--red);font-size:12px;margin-top:10px;text-align:center;display:none;background:#EF444418;border:1px solid #EF444433;border-radius:6px;padding:7px}
/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--n2);border-bottom:1px solid var(--bdr);height:56px;display:flex;align-items:center;padding:0 16px;gap:12px;position:sticky;top:0;z-index:100;flex-shrink:0}
.logo-sq{width:34px;height:34px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--n1);font-size:14px}
.logo-txt .t1{color:var(--gold);font-weight:800;font-size:14px;line-height:1}
.logo-txt .t2{color:var(--faint);font-size:9px;letter-spacing:1px;text-transform:uppercase}
.hdr-badge{background:#8B5CF622;border:1px solid #8B5CF644;border-radius:7px;padding:3px 11px;color:var(--violet);font-size:11px;font-weight:700}
.av{width:32px;height:32px;border-radius:50%;background:#C9A84C33;display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;font-size:11px;flex-shrink:0;border:1px solid #C9A84C44}
.btn-logout{background:none;border:1px solid var(--bdr);border-radius:6px;padding:5px 11px;color:var(--muted);cursor:pointer;font-size:11px;font-family:inherit}
.btn-logout:hover{border-color:var(--red);color:var(--red)}
#layout{display:flex;flex:1;overflow:hidden;min-height:0}
aside{width:192px;flex-shrink:0;background:var(--n2);border-right:1px solid var(--bdr);display:flex;flex-direction:column;transition:width .2s;overflow:hidden}
aside.collapsed{width:0}
nav{padding:10px 7px;flex:1;overflow-y:auto}
.nav-section{color:var(--faint);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:12px 10px 5px}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;border:none;cursor:pointer;background:none;color:var(--muted);font-size:12px;text-align:left;font-family:inherit;border-left:3px solid transparent;margin-bottom:1px;white-space:nowrap;overflow:hidden;transition:all .1s}
.nav-btn.active{background:#C9A84C18;color:var(--gold);font-weight:700;border-left-color:var(--gold)}
.nav-btn:hover:not(.active){background:var(--n4);color:var(--text)}
.nav-icon{font-size:14px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;flex-shrink:0}
.sidebar-foot{padding:10px 14px;border-top:1px solid var(--bdr);font-size:10px;color:var(--faint)}
main{flex:1;overflow-y:auto;padding:20px 24px}
.page{display:none}.page.active{display:block}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-head-left{display:flex;align-items:center;gap:10px}
.page-head h1{font-size:18px;font-weight:800;color:var(--text)}
.page-head .sub{color:var(--faint);font-size:10px;margin-top:3px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.kpi{background:var(--card2);border:1px solid var(--bdr);border-radius:11px;padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kpi-color,var(--gold))}
.kpi-lbl{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.kpi-val{font-size:24px;font-weight:800;line-height:1;color:var(--kpi-color,var(--text))}
.kpi-sub{color:var(--muted);font-size:10px;margin-top:5px}
.card{background:var(--card2);border:1px solid var(--bdr);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{display:flex;align-items:center;gap:7px;color:var(--goldL);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.6px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
table{width:100%;border-collapse:collapse}
th{padding:8px 10px;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bdr);text-align:left;white-space:nowrap}
td{padding:10px 10px;font-size:12px;border-bottom:1px solid #1E3A5F22;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1A366010}
.btn{border:none;border-radius:7px;cursor:pointer;font-weight:700;font-family:inherit;transition:all .1s}
.btn-primary{background:var(--gold);color:var(--n1);padding:8px 16px;font-size:12px}
.btn-primary:hover{background:var(--goldL)}
.btn-ghost{background:none;border:1px solid var(--bdr);color:var(--muted);padding:7px 13px;font-size:11px}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}
.btn-sm{padding:4px 10px;font-size:10px}
.btn-danger{background:#EF444418;border:1px solid #EF444444;color:var(--red);padding:5px 10px;font-size:10px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;border-bottom:1px solid var(--bdr);padding-bottom:10px}
.tab{background:none;border:none;color:var(--muted);padding:6px 14px;font-size:11px;border-radius:7px;cursor:pointer;font-family:inherit;font-weight:600;border-bottom:2px solid transparent;transition:all .1s}
.tab.act{color:var(--gold);border-bottom-color:var(--gold);background:#C9A84C10}
.empty{color:var(--faint);font-size:13px;padding:40px;text-align:center;font-style:italic}
.loading{color:var(--muted);font-size:13px;padding:40px;text-align:center}
.evm-bar-bg{background:var(--n4);border-radius:4px;height:5px;overflow:hidden;width:60px;display:inline-block;vertical-align:middle;margin-left:4px}
.evm-bar-fill{height:100%;border-radius:4px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:#00000088;z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal{background:var(--n2);border:1px solid var(--bdr);border-radius:16px;width:520px;max-width:96vw;max-height:88vh;overflow-y:auto;box-shadow:0 32px 100px #000000AA}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--n2);z-index:1}
.modal-head span{color:var(--gold);font-weight:800;font-size:14px}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:4px}
.modal-close:hover{color:var(--text);background:var(--n4)}
.modal-body{padding:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{margin-bottom:13px}
.form-field label{display:block;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.form-field input,.form-field select,.form-field textarea{width:100%;background:var(--card);border:1px solid var(--bdr);border-radius:7px;padding:9px 12px;color:var(--text);font-size:12px;font-family:inherit;outline:none;transition:border-color .15s}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--gold)}
.form-field select option{background:var(--n2)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--bdr)}
/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--n2);border:1px solid var(--bdr);border-radius:10px;padding:12px 18px;font-size:13px;z-index:1000;display:none;align-items:center;box-shadow:0 8px 32px #00000066;max-width:340px}
.toast.show{display:flex}
.toast.success{border-color:#10B98155;color:var(--green)}
.toast.error{border-color:#EF444455;color:var(--red)}
/* AUDIT */
.audit-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #1E3A5F22;font-size:11px}
.audit-time{color:var(--muted);white-space:nowrap;min-width:140px}
.audit-action{color:var(--gold);font-weight:700;min-width:80px}
.audit-detail{color:var(--text);flex:1}
/* ═══════════════════════════════════════════
   MOBILE RESPONSIVE — Full Breakpoint System
   ═══════════════════════════════════════════ */

/* ── Tablet: 901px – 1100px ── */
@media(max-width:1100px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  aside{width:160px}
  .nav-btn{font-size:11px;padding:7px 8px}
}

/* ── Small Tablet: 601px – 900px ── */
@media(max-width:900px){
  .grid4{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  aside{width:56px;overflow:hidden}
  aside .nav-section,.nav-btn span:last-child,.sidebar-foot,.nav-badge-text{display:none}
  .nav-btn{justify-content:center;padding:10px 0;border-radius:0;border-left:none;border-bottom:2px solid transparent}
  .nav-btn.active{border-bottom-color:var(--gold);border-left:none}
  .nav-icon{font-size:18px;margin:0}
  header .logo-txt{display:none}
  header .t1,.header .t2{display:none}
  .hdr-badge{display:none}
  .page-head h1{font-size:15px}
  table{font-size:10px}
  th,td{padding:6px 8px}
  .kpi-val{font-size:19px}
  .modal{width:98vw;max-width:98vw}
}

/* ── Mobile: ≤600px ── */
@media(max-width:600px){
  /* Layout */
  #layout{flex-direction:column}
  aside{width:100%;height:auto;flex-direction:row;border-right:none;border-bottom:1px solid var(--bdr);flex-shrink:0;overflow-x:auto;overflow-y:hidden}
  aside nav{display:flex;flex-direction:row;padding:4px 6px;gap:2px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
  aside nav::-webkit-scrollbar{display:none}
  .nav-section{display:none}
  .nav-btn{flex-direction:column;gap:2px;padding:6px 8px;min-width:52px;font-size:9px;border-left:none;border-bottom:2px solid transparent;border-radius:6px;white-space:nowrap}
  .nav-btn.active{border-left:none;border-bottom-color:var(--gold)}
  .nav-icon{font-size:20px;margin:0}
  .sidebar-foot{display:none}
  main{padding:10px;overflow-x:hidden}

  /* Grids */
  .grid4,.grid2{grid-template-columns:1fr}
  .grid4.grid-kpi-6{grid-template-columns:repeat(2,1fr)}

  /* Header */
  header{padding:0 10px;height:50px;gap:8px}
  .logo-txt .t2{display:none}
  .logo-txt .t1{font-size:11px}
  .hdr-badge{font-size:9px;padding:3px 7px}
  #user-name{display:none}
  #user-role{display:none}
  .btn-logout{font-size:9px;padding:4px 8px}

  /* Page head */
  .page-head{margin-bottom:12px;gap:8px}
  .page-head h1{font-size:14px}
  .page-head .sub{font-size:9px}
  .page-head-left{gap:7px}
  .page-head-left span[style*="font-size:22px"]{font-size:18px!important}

  /* KPIs */
  .kpi{padding:12px 14px}
  .kpi-val{font-size:17px}
  .kpi-lbl{font-size:9px}
  .kpi-sub{font-size:9px}

  /* Cards */
  .card{padding:12px 14px;margin-bottom:10px}

  /* Tables — horizontal scroll */
  .card .table-wrap,
  .card > table,
  .card > div > table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  table{font-size:10px;white-space:nowrap;min-width:480px}
  th{font-size:9px;padding:5px 6px}
  td{padding:5px 6px}

  /* Tabs */
  .tabs{gap:4px;padding-bottom:8px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font-size:10px;padding:5px 10px;white-space:nowrap;flex-shrink:0}

  /* Modals */
  .modal{width:100vw;max-width:100vw;max-height:95vh;border-radius:16px 16px 0 0;position:fixed;bottom:0;left:0;right:0}
  .modal-overlay{align-items:flex-end}
  .form-row{grid-template-columns:1fr}

  /* Charts — prevent overflow */
  canvas{max-width:100%}

  /* Auth screen */
  .auth-box{padding:28px 20px;width:100%;border-radius:12px}

  /* Page-specific fixes */
  .sec-head{flex-wrap:wrap;gap:6px}
  .sec-title{font-size:12px}
  .btn-sm{font-size:9px;padding:4px 8px}
  .btn{font-size:10px}
  .pill{font-size:9px;padding:2px 6px}

  /* Dashboard charts: stack on mobile */
  [style*="grid-template-columns:2fr 1fr"],
  [style*="grid-template-columns:1fr 2fr"],
  [style*="grid-template-columns:1fr 1fr 1fr"],
  [style*="grid-template-columns:repeat(4,1fr)"],
  [style*="grid-template-columns:repeat(6,1fr)"],
  [style*="grid-template-columns:repeat(8,1fr)"]{
    grid-template-columns:1fr!important
  }
}

const fmtK = v=>{v=Number(v||0);if(v>=1e6)return(v/1e6).toFixed(2)+'M';if(v>=1e3)return(v/1e3).toFixed(0)+'K';return v.toFixed(0)};

// ── AUTH ─────────────────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  const errEl=document.getElementById('auth-error');
  const btn=document.getElementById('btn-login');
  errEl.style.display='none';
  if(!email||!pass){errEl.textContent='Email and password required.';errEl.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){
      errEl.textContent='Invalid email or password.';
      errEl.style.display='block';
      btn.disabled=false;btn.textContent='Sign In';
      return;
    }
    currentUser=data.user;
    await loadProfile(); // throws if profile missing/error → stops here
    enterApp();
  }catch(e){
    // loadProfile already handled the UI error message
    btn.disabled=false;btn.textContent='Sign In';
    currentUser=null;
    currentProfile=null;
  }
}

async function loadProfile(){
  const errEl=document.getElementById('auth-error');
  try{
    const {data,error}=await sb.from('user_profiles').select('*').eq('id',currentUser.id).single();

    // 🔴 CRITICAL: فشل قراءة الـ profile أو عدم وجوده = logout فوري — ممنوع أي fallback
    if(error){
      console.error('Profile load error:',error.message);
      await sb.auth.signOut().catch(()=>{});
      currentUser=null;
      errEl.textContent='Account not configured. Contact your system administrator.';
      errEl.style.display='block';
      document.getElementById('btn-login').disabled=false;
      document.getElementById('btn-login').textContent='Sign In';
      throw new Error('Profile error: '+error.message);
    }
    if(!data){
      console.error('Profile not found for user:', currentUser.id);
      await sb.auth.signOut().catch(()=>{});
      currentUser=null;
      errEl.textContent='User profile not found. Contact your system administrator.';
      errEl.style.display='block';
      document.getElementById('btn-login').disabled=false;
      document.getElementById('btn-login').textContent='Sign In';
      throw new Error('Profile not found');
    }

    // Profile loaded successfully
    currentProfile=data;
    document.getElementById('user-av').textContent=data.initials||data.full_name?.substring(0,2)||'?';
    document.getElementById('user-av').style.background=(data.color||'#C9A84C')+'33';
    document.getElementById('user-av').style.color=data.color||'#C9A84C';
    document.getElementById('user-name').textContent=data.full_name||'—';
    document.getElementById('user-role').textContent=data.role||'—';

  }catch(e){
    // Re-throw so doLogin() stops and doesn't call enterApp()
    throw e;
  }
}

function enterApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  // Show/hide nav based on role
  const allowed=ROLE_PAGES[currentProfile?.role]||['dashboard'];
  ['bizdev','projects','procurement','finance','hr','qhse','documents','workflow','audit','users','ceo'].forEach(p=>{
    const btn=document.getElementById('nav-'+p);
    if(btn)btn.style.display=allowed.includes(p)?'':'none';

  navTo('dashboard',document.querySelector('.nav-btn.active'));
  loadWfBadge();
  initRealtime();
}

// ── REALTIME ─────────────────────────────────────────────────
let _realtimeChannel = null;
let _realtimeDebounce = {};

function initRealtime(){
  // Clean up existing subscription
  if(_realtimeChannel){
    try{ sb.removeChannel(_realtimeChannel); }catch(e){}
    _realtimeChannel = null;
  }

  _realtimeChannel = sb
    .channel('sp360-erp-live')
    .on('postgres_changes',
      { event:'*', schema:'public', table:'projects' },
      (payload) => handleRealtimeUpdate('projects', payload)
    )
    .on('postgres_changes',
      { event:'*', schema:'public', table:'workflow_items' },
      (payload) => handleRealtimeUpdate('workflow_items', payload)
    )
    .on('postgres_changes',
      { event:'*', schema:'public', table:'change_orders' },
      (payload) => handleRealtimeUpdate('change_orders', payload)
    )
    .on('postgres_changes',
      { event:'*', schema:'public', table:'invoices' },
      (payload) => handleRealtimeUpdate('invoices', payload)
    )
    .subscribe((status) => {
      if(status === 'SUBSCRIBED'){
        console.log('SP360 Realtime: connected');
        showRealtimeBadge(true);
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
        console.warn('SP360 Realtime:', status);
        showRealtimeBadge(false);
      }
    });
}

function showRealtimeBadge(connected){
  const badge = document.getElementById('pending-badge');
  if(!badge) return;
  // Show live indicator
  const liveEl = document.getElementById('realtime-dot');
  if(liveEl) liveEl.style.background = connected ? '#10B981' : '#EF4444';
}

function handleRealtimeUpdate(table, payload){
  // Debounce: avoid rapid re-renders (wait 800ms after last event)
  if(_realtimeDebounce[table]) clearTimeout(_realtimeDebounce[table]);
  _realtimeDebounce[table] = setTimeout(()=>{
    const activePage = document.querySelector('.page.active')?.id?.replace('page-','');
    // Show live toast for workflow changes
    if(table === 'workflow_items'){
      const evt = payload.eventType;
      const newRec = payload.new;
      if(evt === 'INSERT' || (evt === 'UPDATE' && newRec?.status)){
        showToast(`⚡ Workflow updated: ${newRec?.ref_no || 'item'} — ${newRec?.status || ''}`, 'success');
      }
      loadWfBadge(); // Always refresh badge
    }
    if(table === 'change_orders' && payload.eventType !== 'DELETE'){
      const newRec = payload.new;
      if(newRec?.workflow_status === 'submitted'){
        showToast(`📋 New CO submitted: ${newRec.co_no || ''}`, 'success');
      }
    }
    // Refresh active page if relevant
    const pageMap = {
      projects:     ['projects','dashboard','ceo'],
      workflow_items:['workflow','dashboard','ceo'],
      change_orders: ['projects','ceo'],
      invoices:      ['finance','dashboard','ceo']
    };
    const refreshPages = pageMap[table] || [];
    if(refreshPages.includes(activePage)){
      const loaders = {
        dashboard: loadDashboard, projects: ()=>loadProjects(curProjTab),
        workflow: loadWorkflow, finance: loadFinance, ceo: loadCEO
      };
      if(loaders[activePage]) loaders[activePage]();
    }
  }, 800);
}

async function doLogout(){
  // Cleanup Realtime subscription first
  if(_realtimeChannel){
    try{ sb.removeChannel(_realtimeChannel); }catch(e){}
    _realtimeChannel = null;
  }
  // Proper Supabase signOut — invalidates token server-side + clears session
  try{ await sb.auth.signOut(); }catch(e){ console.warn('SignOut error:',e); }
  currentUser=null; currentProfile=null;
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('login-email').value='';
  document.getElementById('login-pass').value='';
}

async function loadWfBadge(){
  const {data}=await sb.from('workflow_items').select('id').in('status',['pending','overdue']);
  const count=(data||[]).length;
  document.getElementById('pending-badge').textContent=`⚡ ${count} pending`;
  const badge=document.getElementById('wf-badge');
  badge.style.display=count>0?'':'none';
  badge.textContent=count;
}

// ── NAVIGATION ───────────────────────────────────────────────
function toggleSide(){document.getElementById('sidebar').classList.toggle('collapsed');}
function navTo(id,btn){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const pg=document.getElementById('page-'+id);
  if(pg)pg.classList.add('active');
  const loaders={
    dashboard:loadDashboard,bizdev:loadBizdev,projects:loadProjects,
    procurement:()=>loadProc(curProcTab),finance:loadFinance,
    hr:()=>loadHR(curHRTab),qhse:()=>loadQHSE(curQHSETab),
    documents:()=>loadDocs(curDocTab),workflow:loadWorkflow,audit:loadAudit,
    users:loadUsers,ceo:loadCEO
  };
  if(loaders[id])loaders[id]();
}

  const ncrs=ncrR.data||[], snaps=snapR.data||[];

  const totalEV=projs.reduce((s,p)=>s+Number(p.ev),0);

  const cost=invs.filter(i=>i.invoice_type!=='client'&&i.status==='paid').reduce((s,i)=>s+Number(i.net_amount),0);

    deptLabels:depts.map(d=>d[0]),
    deptData:depts.map(d=>Math.round(d[1]/1000)),
    revCost:[Math.round(rev/1000),Math.round(cost/1000),Math.round((rev-cost)/1000)],
    ragData:[ragG,ragA,ragR],

    scPV:periods.map(p=>p.pv),

    ${kpi('Gross Profit',fmtKWD(rev-cost),rev-cost>=0?'#C9A84C':'#EF4444',rev>0?(((rev-cost)/rev*100).toFixed(1)+'% margin'):'No revenue yet')}

async function advanceOpp(id, newStatus){
  const {error}=await sb.from('opportunities').update({status:newStatus}).eq('id',id);
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('opportunities',id,'STAGE_CHANGE',null,{status:newStatus},'Pipeline stage advanced');
  showToast('Stage updated');
  loadBizdev();
}

async function awardOpp(id, opp_no, title, client, value, dept){
  if(!confirm(`Award "${title}" to ${client}?`))return;
  await sb.from('opportunities').update({status:'won',probability:100}).eq('id',id);
  await writeAudit('opportunities',id,'AWARDED',null,{status:'won',opp_no},'Opportunity awarded');
  showToast('Opportunity awarded — now convert to Project');
  loadBizdev();
}

async function convertToProject(oppId, opp_no, title, client, value, dept){
  const role=currentProfile?.role;
  if(!['PMO Manager','BD Manager'].includes(role)){
    showToast('Only BD Manager or PMO Manager can convert to Project','error');return;
  }
  const deptCode={Security:'SEC','AV/Broadcast':'AV',IT:'IT',Power:'PW',Civil:'CV',Wireless:'WL',Trading:'TR'}[dept]||'XX';
  const year=new Date().getFullYear();
  const {data:allProjs}=await sb.from('projects').select('project_no').ilike('project_no',`SP360-${deptCode}-%`);
  const maxSeq=(allProjs||[]).reduce((max,p)=>{const n=Number((p.project_no||'').split('-')[2]||0);return n>max?n:max;},0);
  const project_no=`SP360-${deptCode}-${String(maxSeq+1).padStart(3,'0')}`;
  const {data:proj,error}=await sb.from('projects').insert({
    project_no,name:title,client,department:dept,
    contract_value:value,bac:value,ac:0,ev:0,pv:0,pct:0,cpi:1,spi:1,
    status:'initiation',priority:'high',
    pm_id:currentProfile?.id,created_by:currentProfile?.id
  }).select().single();
  if(error){showToast('Error: '+error.message,'error');return;}
  await sb.from('opportunities').update({project_id:proj.id}).eq('id',oppId);
  await writeAudit('projects',proj.id,'CREATED_FROM_OPPORTUNITY',null,{project_no,opp_no,contract_value:value},'Converted from opportunity '+opp_no);
  showToast(`Project ${project_no} created from ${opp_no} ✓`);
  loadBizdev();
}

function previewEV(projId, bac){
  const pct=Number(document.getElementById('pct_'+projId).value)||0;
  const ac=Number(document.getElementById('ac_'+projId).value)||0;
  const ev=bac*pct/100;
  const cpi=ac>0?(ev/ac).toFixed(2):'1.00';
  const evEl=document.getElementById('ev_'+projId);
  const cpiEl=document.getElementById('cpi_'+projId);
  if(evEl)evEl.textContent=fmtKWD(ev);
  if(cpiEl){cpiEl.textContent=cpi;cpiEl.style.color=cpiColor(cpi);}
}

async function saveProgress(projId, bac){
  const pct=Number(document.getElementById('pct_'+projId).value)||0;
  const ac=Number(document.getElementById('ac_'+projId).value)||0;
  const ev=Math.round(bac*pct/100*100)/100;
  const cpi=ac>0?Math.round(ev/ac*100)/100:1;

  // SPI = EV / PV — PV from time-phased baseline (get_current_pv RPC)
  // Falls back to stored pv if no baseline exists
  const {data:proj}=await sb.from('projects').select('pct,ac,ev,cpi,spi,pv,bac').eq('id',projId).single();
  let pv=Number(proj?.pv)||0;
  try{
    const {data:pvData}=await sb.rpc('get_current_pv',{p_project_id:projId});
    if(pvData&&pvData>0) pv=pvData;
  }catch(e){ /* fallback to stored pv */ }
  if(pv===0) pv=Math.round(bac*pct/100*100)/100; // last resort fallback
  const spi=pv>0?Math.round(ev/pv*100)/100:1;

  const {error}=await sb.from('projects').update({pct,ac,ev,cpi,spi,pv}).eq('id',projId);
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('projects',projId,'PROGRESS_UPDATE',
    {pct:proj?.pct,ac:proj?.ac,ev:proj?.ev,cpi:proj?.cpi,spi:proj?.spi},
    {pct,ac,ev,cpi,spi,pv},
    'Progress updated');
  showToast('Progress saved ✓');
  loadProjects('progress');
}

async function advanceProject(projId, newStatus, event){
  if(!newStatus)return;
  const {error}=await sb.from('projects').update({status:newStatus}).eq('id',projId);
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('projects',projId,'LIFECYCLE_ADVANCE',null,{status:newStatus},'Project phase advanced');
  showToast('Project phase updated to: '+PROJ_LIFECYCLE_LABELS[newStatus]);
  loadProjects('lifecycle');
}

async function savePO(){
  const projId=document.getElementById('po-proj').value;
  const vendId=document.getElementById('po-vendor').value;
  const desc=document.getElementById('po-desc').value.trim();
  const val=Number(document.getElementById('po-val').value)||0;
  const poNo=document.getElementById('po-no').value.trim();
  const issueDate=document.getElementById('po-date').value;
  const delivery=document.getElementById('po-delivery').value;
  const terms=document.getElementById('po-terms').value.trim();

  if(!projId||!vendId||!desc||val<=0){showToast('Project, Vendor, Description and Value required','error');return;}
  const btn=event?.target;
  if(btn){btn.disabled=true;btn.textContent='Creating…';}
  try{
    const {data,error}=await sb.from('purchase_orders').insert({
      po_no:poNo, project_id:projId, vendor_id:vendId,
      description:desc, total_value:val,
      issue_date:issueDate, delivery_date:delivery||null,
      terms_conditions:terms||null,
      status:'draft', created_by:currentProfile?.id
    }).select().single();
    if(error){showToast('Error: '+error.message,'error');return;}
    await writeAudit('purchase_orders',data.id,'CREATED',null,{po_no:poNo,total_value:val,status:'draft'},'PO created');
    showToast(`PO ${poNo} created — click Submit to start approval ✓`);
    closeModal(); loadProc('pos');
  }catch(e){showToast('Error: '+e.message,'error');}
  finally{if(btn){btn.disabled=false;btn.textContent='Create PO (Draft)';}}
}

async function submitPO(poId){
  if(!confirm('Submit this PO for Dept. Approval?')) return;
  const btn=event?.target;
  if(btn){btn.disabled=true;btn.textContent='Submitting…';}
  try{
    const {data:po,error:e1}=await sb.from('purchase_orders').update({status:'submitted'}).eq('id',poId).select().single();
    if(e1){showToast('Error: '+e1.message,'error');return;}
    // Create workflow item
    const refNo=`WF-PO-${po.po_no}`;
    const {error:e2}=await sb.from('workflow_items').insert({
      ref_no:refNo, entity_type:'po', entity_id:poId,
      entity_ref:po.po_no, current_step:'Dept. Approval',
      status:'pending', submitted_by:currentProfile?.id,
      submitted_date:new Date().toISOString(),
      project_id:po.project_id
    });
    if(e2){
      await sb.from('purchase_orders').update({status:'draft'}).eq('id',poId);
      showToast('Workflow creation failed — PO reverted to draft','error');return;
    }
    await writeAudit('purchase_orders',poId,'SUBMITTED',{status:'draft'},{status:'submitted',workflow:refNo},'PO submitted for approval');
    showToast(`PO submitted — Ref: ${refNo} ✓`);
    loadProc('pos'); loadWfBadge();
  }catch(e){showToast('Error: '+e.message,'error');}
  finally{if(btn){btn.disabled=false;btn.textContent='Submit ▶';}}
}

async function saveMRV(poId,projectId){
  const mrvNo=document.getElementById('mrv-no').value;
  const date=document.getElementById('mrv-date').value;
  const by=document.getElementById('mrv-by').value.trim();
  const cond=document.getElementById('mrv-condition').value;
  const val=Number(document.getElementById('mrv-val').value)||0;
  const notes=document.getElementById('mrv-notes').value.trim();
  if(!date||!by){showToast('Date and Received By required','error');return;}
  const btn=event?.target;
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    const {data,error}=await sb.from('mrvs').insert({
      mrv_no:mrvNo, po_id:poId, project_id:projectId,
      received_date:date, received_by:by,
      condition:cond, received_value:val||null,
      notes:notes||null, created_by:currentProfile?.id
    }).select().single();
    if(error){showToast('Error: '+error.message,'error');return;}
    // Mark PO as received if condition is good/partial
    if(cond!=='rejected'){
      await sb.from('purchase_orders').update({status:cond==='good'?'received':'partial_receipt'}).eq('id',poId);
    }
    await writeAudit('mrvs',data.id,'CREATED',null,{mrv_no:mrvNo,condition:cond,po_id:poId},'MRV recorded');
    showToast(`MRV ${mrvNo} saved ✓`);
    closeModal(); loadProc('mrvs');
  }catch(e){showToast('Error: '+e.message,'error');}
  finally{if(btn){btn.disabled=false;btn.textContent='Save MRV';}}
}

async function loadFinance(tab='overview'){
  curFinTab=tab||'overview';
  const el=document.getElementById('page-finance');
  el.innerHTML=`<div class="loading">Loading…</div>`;

  const {data:invList}=await sb.from('invoices')
    .select('*,project:projects(project_no,name,bac)')
    .order('created_at',{ascending:false});
  const ALL=invList||[];
  const today=new Date();
  const curMonth=new Date().toISOString().slice(0,7);

  const clientPaid   =ALL.filter(i=>i.invoice_type==='client'&&i.status==='paid');
  const clientPend   =ALL.filter(i=>i.invoice_type==='client'&&!['paid','cancelled'].includes(i.status));
  const supplierPaid =ALL.filter(i=>i.invoice_type!=='client'&&i.status==='paid');
  const supplierPend =ALL.filter(i=>i.invoice_type!=='client'&&!['paid','cancelled'].includes(i.status));

  const totalRevenue  =clientPaid.reduce((s,i)=>s+Number(i.net_amount),0);
  const totalCost     =supplierPaid.reduce((s,i)=>s+Number(i.net_amount),0);
  const arOutstanding =clientPend.reduce((s,i)=>s+Number(i.net_amount),0);
  const apOutstanding =supplierPend.reduce((s,i)=>s+Number(i.net_amount),0);
  const grossProfit   =totalRevenue-totalCost;
  const margin        =totalRevenue>0?(grossProfit/totalRevenue*100):0;
  const retentionHeld =ALL.filter(i=>i.invoice_type==='client'&&Number(i.retention_pct)>0)
    .reduce((s,i)=>s+Number(i.gross_amount)*Number(i.retention_pct)/100,0);
  const overdueAR=clientPend.filter(i=>i.due_date&&new Date(i.due_date)<today);

  const tabs=`<div class="tabs">
    ${['overview','ar','ap','cashflow','retention'].map((t,idx)=>
    `<button class="tab${t===tab?' act':''}" onclick="loadFinance('${t}')">
      ${['📊 Overview','📥 AR','📤 AP','💹 Cash Flow','🔒 Retention'][idx]}
    </button>`).join('')}
  </div>`;

  let body='';

  if(tab==='overview'){
    body=`
    <div class="grid4" style="margin-bottom:14px">
      ${kpi('Revenue Collected',fmtKWD(totalRevenue),'#10B981','Client invoices paid')}
      ${kpi('AR Outstanding',fmtKWD(arOutstanding),overdueAR.length>0?'#EF4444':'#F97316',overdueAR.length>0?'⚠️ '+overdueAR.length+' overdue':'Pending collection')}
      ${kpi('Cost Paid',fmtKWD(totalCost),'#EF4444','Supplier invoices paid')}
      ${kpi('Gross Profit',fmtKWD(grossProfit),grossProfit>=0?'#C9A84C':'#EF4444',margin.toFixed(1)+'% margin')}
    </div>
    <div class="grid4" style="margin-bottom:14px">
      ${kpi('AP Outstanding',fmtKWD(apOutstanding),'#8B5CF6','Supplier bills due')}
      ${kpi('Retention Held',fmtKWD(retentionHeld),'#3B82F6','Client retention')}
      ${kpi('Net Cash',fmtKWD(totalRevenue-totalCost-apOutstanding),totalRevenue-totalCost-apOutstanding>=0?'#10B981':'#EF4444','Collected minus paid')}
      ${kpi('This Month',ALL.filter(i=>i.created_at?.startsWith(curMonth)).length,'#E2E8F0','Invoices created')}
    </div>
    <table><thead><tr>
      <th>Invoice No</th><th>Project</th><th style="text-align:center">Type</th>
      <th style="text-align:right">Net (KWD)</th><th>Due Date</th>
      <th style="text-align:center">Status</th><th style="text-align:center">Action</th>
    </tr></thead><tbody>
    ${ALL.slice(0,20).map(i=>{
      const ov=i.due_date&&new Date(i.due_date)<today&&i.status!=='paid';
      const canSubmit=i.status==='draft';
      const canPaid=i.status==='approved'&&(currentProfile?.role==='PMO Manager'||currentProfile?.role==='Finance Manager');
      return`<tr>
        <td style="color:var(--gold);font-size:10px;white-space:nowrap">${esc(i.invoice_no)}</td>
        <td style="color:var(--muted);font-size:11px">${esc(i.project?.project_no||'—')}</td>
        <td style="text-align:center">${pill(i.invoice_type,i.invoice_type==='client'?'#10B981':i.invoice_type==='supplier'?'#F97316':'#8B5CF6')}</td>
        <td style="text-align:right;font-weight:800;color:var(--gold)">${fmtKWD(i.net_amount)}</td>
        <td style="color:${ov?'#EF4444':'#94A3B8'};font-size:11px">${i.due_date||'—'}${ov?' ⚠️':''}</td>
        <td style="text-align:center">${pill(i.status)}</td>
        <td style="text-align:center">
          ${canSubmit?`<button class="btn btn-primary btn-sm" style="font-size:10px;padding:3px 8px" onclick="submitInvoice('${i.id}')">Submit ▶</button>`:''}
          ${canPaid?`<button class="btn btn-ghost btn-sm" style="font-size:10px;padding:3px 8px" onclick="markInvoicePaid('${i.id}')">Mark Paid</button>`:''}
        </td>
      </tr>`;
    }).join('')}
    </tbody></table>`;

  } else if(tab==='ar'){
    const ar=ALL.filter(i=>i.invoice_type==='client');
    const aging={current:0,d30:0,d60:0,d90:0,d90p:0};
    ar.filter(i=>!['paid','cancelled'].includes(i.status)).forEach(i=>{
      if(!i.due_date){aging.current+=Number(i.net_amount);return;}
      const days=Math.floor((today-new Date(i.due_date))/(86400000));
      if(days<=0)aging.current+=Number(i.net_amount);
      else if(days<=30)aging.d30+=Number(i.net_amount);
      else if(days<=60)aging.d60+=Number(i.net_amount);
      else if(days<=90)aging.d90+=Number(i.net_amount);
      else aging.d90p+=Number(i.net_amount);
    });
    body=`
    <div class="grid4" style="margin-bottom:14px">
      ${kpi('Total AR',fmtKWD(ar.reduce((s,i)=>s+Number(i.net_amount),0)),'#E2E8F0','All client invoices')}
      ${kpi('Collected',fmtKWD(totalRevenue),'#10B981','Paid')}
      ${kpi('Outstanding',fmtKWD(arOutstanding),overdueAR.length>0?'#EF4444':'#F97316',overdueAR.length+' overdue')}
      ${kpi('Collection Rate',totalRevenue+arOutstanding>0?((totalRevenue/(totalRevenue+arOutstanding))*100).toFixed(1)+'%':'—','#C9A84C','')}
    </div>
    <div class="card" style="margin-bottom:14px;padding:14px 16px">
      <div class="sec-title" style="margin-bottom:10px"><span>📅</span>AR Aging Analysis</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center">
        ${[['Current',aging.current,'#10B981'],['1–30 Days',aging.d30,'#F97316'],['31–60 Days',aging.d60,'#EF444499'],['61–90 Days',aging.d90,'#EF4444'],['90+ Days',aging.d90p,'#7F1D1D']].map(([l,v,c])=>
        `<div style="padding:10px;background:${c}18;border:1px solid ${c}44;border-radius:8px">
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">${l}</div>
          <div style="font-size:13px;font-weight:800;color:${c}">${fmtKWD(v)}</div>
        </div>`).join('')}
      </div>
    </div>
    <table><thead><tr>
      <th>Invoice No</th><th>Project</th><th style="text-align:right">Net (KWD)</th>
      <th>Due Date</th><th style="text-align:center">Days O/S</th>
      <th style="text-align:center">Status</th><th style="text-align:center">Action</th>
    </tr></thead><tbody>
    ${ar.map(i=>{
      const days=i.due_date&&!['paid','cancelled'].includes(i.status)?Math.floor((today-new Date(i.due_date))/86400000):null;
      const ov=days!==null&&days>0;
      const canPaid=i.status==='approved'&&(currentProfile?.role==='PMO Manager'||currentProfile?.role==='Finance Manager');
      return`<tr>
        <td style="color:var(--gold);font-size:10px">${esc(i.invoice_no)}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(i.project?.project_no||'—')}</td>
        <td style="text-align:right;font-weight:800;color:var(--gold)">${fmtKWD(i.net_amount)}</td>
        <td style="font-size:11px;color:${ov?'#EF4444':'var(--muted)'}">${i.due_date||'—'}</td>
        <td style="text-align:center;font-weight:700;color:${ov?'#EF4444':days===null?'var(--faint)':'#10B981'}">
          ${days===null?'—':days<=0?Math.abs(days)+'d left':days+'d OD'}
        </td>
        <td style="text-align:center">${pill(i.status)}</td>
        <td style="text-align:center">
          ${canPaid?`<button class="btn btn-ghost btn-sm" style="font-size:10px;padding:2px 7px" onclick="markInvoicePaid('${i.id}')">Paid ✓</button>`:''}
        </td>
      </tr>`;
    }).join('')}
    </tbody></table>`;

  } else if(tab==='ap'){
    const ap=ALL.filter(i=>i.invoice_type!=='client');
    const apPaid=ap.filter(i=>i.status==='paid').reduce((s,i)=>s+Number(i.net_amount),0);
    const apOv=supplierPend.filter(i=>i.due_date&&new Date(i.due_date)<today);
    body=`
    <div class="grid4" style="margin-bottom:14px">
      ${kpi('Total AP',fmtKWD(ap.reduce((s,i)=>s+Number(i.net_amount),0)),'#E2E8F0','')}
      ${kpi('Paid',fmtKWD(apPaid),'#10B981','Settled')}
      ${kpi('Outstanding',fmtKWD(apOutstanding),apOv.length>0?'#EF4444':'#8B5CF6',apOv.length+' overdue')}
      ${kpi('Payment Rate',apPaid+apOutstanding>0?((apPaid/(apPaid+apOutstanding))*100).toFixed(1)+'%':'—','#C9A84C','')}
    </div>
    <table><thead><tr>
      <th>Invoice No</th><th>Project</th><th style="text-align:center">Type</th>
      <th style="text-align:right">Net (KWD)</th><th>Due Date</th>
      <th style="text-align:center">Days O/S</th><th style="text-align:center">Status</th>
      <th style="text-align:center">Action</th>
    </tr></thead><tbody>
    ${ap.map(i=>{
      const days=i.due_date&&!['paid','cancelled'].includes(i.status)?Math.floor((today-new Date(i.due_date))/86400000):null;
      const ov=days!==null&&days>0;
      const canPay=i.status==='approved'&&(currentProfile?.role==='PMO Manager'||currentProfile?.role==='Finance Manager');
      return`<tr>
        <td style="color:var(--gold);font-size:10px">${esc(i.invoice_no)}</td>
        <td style="font-size:11px;color:var(--muted)">${esc(i.project?.project_no||'—')}</td>
        <td style="text-align:center">${pill(i.invoice_type,i.invoice_type==='supplier'?'#F97316':'#8B5CF6')}</td>
        <td style="text-align:right;font-weight:800;color:${ov?'#EF4444':'var(--gold)'}">${fmtKWD(i.net_amount)}</td>
        <td style="font-size:11px;color:${ov?'#EF4444':'var(--muted)'}">${i.due_date||'—'}${ov?' ⚠️':''}</td>
        <td style="text-align:center;font-weight:700;color:${ov?'#EF4444':days===null?'var(--faint)':'#10B981'}">
          ${days===null?'—':days<=0?Math.abs(days)+'d left':days+'d OD'}
        </td>
        <td style="text-align:center">${pill(i.status)}</td>
        <td style="text-align:center">
          ${canPay?`<button class="btn btn-ghost btn-sm" style="font-size:10px;padding:2px 7px" onclick="markInvoicePaid('${i.id}')">Pay ✓</button>`:''}
        </td>
      </tr>`;
    }).join('')}
    </tbody></table>`;

  } else if(tab==='cashflow'){
    const months=[];
    for(let i=-5;i<=3;i++){
      const d=new Date(today.getFullYear(),today.getMonth()+i,1);
      months.push(d.toISOString().slice(0,7));
    }
    const cfData=months.map(m=>{
      const isFuture=m>curMonth;
      const inflow =ALL.filter(i=>i.invoice_type==='client'&&i.status==='paid'&&i.paid_date?.startsWith(m)).reduce((s,i)=>s+Number(i.net_amount),0);
      const outflow=ALL.filter(i=>i.invoice_type!=='client'&&i.status==='paid'&&i.paid_date?.startsWith(m)).reduce((s,i)=>s+Number(i.net_amount),0);
      const fcIn   =ALL.filter(i=>i.invoice_type==='client'&&!['paid','cancelled'].includes(i.status)&&i.due_date?.startsWith(m)).reduce((s,i)=>s+Number(i.net_amount),0);
      const fcOut  =ALL.filter(i=>i.invoice_type!=='client'&&!['paid','cancelled'].includes(i.status)&&i.due_date?.startsWith(m)).reduce((s,i)=>s+Number(i.net_amount),0);
      const fin=isFuture?fcIn:inflow, fout=isFuture?fcOut:outflow;
      return{m,inflow:fin,outflow:fout,isFuture,net:fin-fout};
    });
    const maxVal=Math.max(...cfData.map(d=>Math.max(d.inflow,d.outflow)),1);
    body=`
    <div class="grid4" style="margin-bottom:14px">
      ${kpi('YTD Inflow',fmtKWD(ALL.filter(i=>i.invoice_type==='client'&&i.status==='paid'&&i.paid_date?.startsWith(String(today.getFullYear()))).reduce((s,i)=>s+Number(i.net_amount),0)),'#10B981','This year collected')}
      ${kpi('YTD Outflow',fmtKWD(ALL.filter(i=>i.invoice_type!=='client'&&i.status==='paid'&&i.paid_date?.startsWith(String(today.getFullYear()))).reduce((s,i)=>s+Number(i.net_amount),0)),'#EF4444','This year paid')}
      ${kpi('Forecast Inflow',fmtKWD(arOutstanding),'#3B82F6','Pending AR')}
      ${kpi('Forecast Outflow',fmtKWD(apOutstanding),'#8B5CF6','Pending AP')}
    </div>
    <div class="card" style="padding:16px 18px;margin-bottom:14px">
      <div class="sec-title" style="margin-bottom:14px"><span>💹</span>Monthly Cash Flow — Actual + Forecast</div>
      <div style="display:grid;grid-template-columns:repeat(9,1fr);gap:6px;align-items:end;min-height:140px">
        ${cfData.map(d=>{
          const inH=Math.round((d.inflow/maxVal)*120)||2;
          const outH=Math.round((d.outflow/maxVal)*120)||2;
          return`<div style="text-align:center">

async function wfApprove(wfId,entityType,entityId,currentStep){
  const btn=event?.target;
  if(btn){btn.disabled=true;btn.textContent='Approving…';}
  try{
    const {data,error}=await sb.rpc('approve_workflow_item',{
      p_wf_id:        wfId,
      p_entity_type:  entityType,
      p_entity_id:    entityId,
      p_current_step: currentStep
    });
    if(error){showToast('Error: '+error.message,'error');return;}
    if(!data?.ok){showToast('Approval failed: '+(data?.error||'Unknown error'),'error');return;}
    showToast(data.final?'Workflow completed ✓':'Approved — advanced to next step ✓');

    loadWorkflow();
  }catch(e){
    showToast('Error: '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Approve';}
  }
}

async function wfReturn(wfId,entityType,entityId){

  if(btn){btn.disabled=true;btn.textContent='Returning…';}

      p_wf_id:       wfId,

      p_entity_id:   entityId,

    });
    if(error){showToast('Error: '+error.message,'error');return;}

  }catch(e){

async function saveNewUser(){
  const name   =document.getElementById('nu-name').value.trim();
  const email  =document.getElementById('nu-email').value.trim();
  const role   =document.getElementById('nu-role').value;
  const initials=(document.getElementById('nu-initials').value.trim()||name.split(' ').map(w=>w[0]).join('').substring(0,2)).toUpperCase();
  const pass   =document.getElementById('nu-pass').value;
  const pass2  =document.getElementById('nu-pass2').value;
  const errEl  =document.getElementById('nu-err');
  const btn    =event?.target;

  const showErr=msg=>{errEl.textContent=msg;errEl.style.display='block';};
  errEl.style.display='none';

  if(!name||!email||!pass){showErr('Name, Email and Password are required');return;}
  if(pass.length<8){showErr('Password must be at least 8 characters');return;}
  if(pass!==pass2){showErr('Passwords do not match');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('Invalid email address');return;}

  if(btn){btn.disabled=true;btn.textContent='Creating…';}
  try{
    const {data:{session}}=await sb.auth.getSession();
    const token=session?.access_token;
    if(!token){showErr('Session expired — please log in again');return;}

    const res=await fetch(CREATE_USER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`,'apikey':SUPABASE_KEY},
      body:JSON.stringify({email,password:pass,full_name:name,role,initials})
    });
    const data=await res.json();

    if(!res.ok||!data.ok){
      showErr(data.error||'User creation failed');
      return;
    }
    showToast(`User ${name} created ✓`);
    closeModal();loadUsers();
  }catch(e){
    showErr('Network error: '+e.message);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Create User';}
  }
}

// ── EMAIL ENGINE ─────────────────────────────────────────────
// Primary: Supabase Edge Function (send-email) via Resend API
// Fallback: mailto (opens local email client)
// Setup: Deploy edge function + set RESEND_API_KEY secret in Supabase

const EMAIL_EDGE_URL = `${SUPABASE_URL}/functions/v1/send-email`;
let _edgeFnAvailable = null; // null=unknown, true=working, false=use mailto

async function sendViaEdge(to, subject, bodyText, htmlBody=''){
  // Test edge fn availability once per session
  if(_edgeFnAvailable === false) return false;
  try {
    const {data:{session}} = await sb.auth.getSession();
    const token = session?.access_token;
    // 🔴 SECURITY: never fallback to SUPABASE_KEY as user authorization
    if(!token){ _edgeFnAvailable=false; return false; }
    const res = await fetch(EMAIL_EDGE_URL, {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':`Bearer ${token}`,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({
        to: Array.isArray(to) ? to : [to],
        subject,
        text: bodyText,
        html: htmlBody || buildEmailHTML(subject, bodyText),
        from_name: 'SP360 ERP'
      })
    });
    if(res.ok){ _edgeFnAvailable=true; return true; }
    // 404 = function not deployed yet → use fallback
    if(res.status===404){ _edgeFnAvailable=false; return false; }
    const err=await res.json().catch(()=>({}));
    console.warn('Edge fn email error:',err);
    return false;
  } catch(e){
    _edgeFnAvailable=false;
    return false;
  }
}

function buildEmailHTML(subject, bodyText){
  // Professional HTML email template — Navy & Gold
  const lines = bodyText.split('\n');
  const htmlLines = lines.map(l=>{
    if(l.startsWith('  •')) return `<li style="margin:4px 0;color:#334155">${l.replace('  •','').trim()}</li>`;
    if(l==='') return '<br>';
    return `<p style="margin:6px 0;color:#334155;font-size:14px">${l}</p>`;
  }).join('');
  return `<!DOCTYPE html><html><body style="margin:0;padding:0;font-family:Calibri,Arial,sans-serif;background:#F8FAFC">
  <div style="max-width:600px;margin:24px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.08)">
    <div style="background:#1E3A5F;padding:24px 28px;display:flex;align-items:center;gap:14px">
      <div style="width:44px;height:44px;background:#C9A84C;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0D1B2A;font-size:18px">SP</div>
      <div>
        <div style="color:#C9A84C;font-size:18px;font-weight:800">${subject}</div>
        <div style="color:#94A3B8;font-size:11px;margin-top:2px">SP360 ERP v1.8 · Smart Projects 360 · Kuwait</div>
      </div>
    </div>
    <div style="padding:24px 28px">${htmlLines}</div>
    <div style="background:#F1F5F9;padding:14px 28px;text-align:center;font-size:11px;color:#94A3B8;border-top:1px solid #E2E8F0">
      SP360 ERP v1.8 · Confidential — For Internal Use Only<br>
      <a href="https://falconbold1999-ops.github.io/sp360-erp/" style="color:#C9A84C">Open SP360 ERP</a>
    </div>
  </div></body></html>`;
}

function fallbackMailto(to, subject, bodyText){
  const toStr = Array.isArray(to) ? to.join(';') : to;
  const url = `mailto:${encodeURIComponent(toStr)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
  window.open(url,'_blank');
}

async function dispatchEmail(to, subject, bodyText, label='Email'){
  const btn = event?.target;
  if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  try {
    const sent = await sendViaEdge(to, subject, bodyText);
    if(sent){
      showToast(`${label} sent ✓`);
    } else {
      // Fallback to mailto
      fallbackMailto(to, subject, bodyText);
      showToast(`${label} — Email client opened`);
    }
  } finally {
    if(btn){ btn.disabled=false; btn.textContent=label==='Email'?'Send Email':'Send'; }
  }
}

  openModal('Send Email — '+esc(name),`
  <div style="margin-bottom:10px;padding:8px 12px;background:${_edgeFnAvailable===false?'#EF444411':'#10B98111'};border:1px solid ${_edgeFnAvailable===false?'#EF444433':'#10B98133'};border-radius:6px;font-size:10px;color:var(--muted)">
    ${_edgeFnAvailable===false
      ? '📧 Edge Function not deployed — will open email client instead'
      : '📧 Sends directly via Resend API (no email client needed)'}
  </div>
  <div class="form-field"><label>To</label>
    <input id="em-to" value="${esc(email)}" style="font-family:monospace"/>
  </div>
  <div class="form-field"><label>Subject</label>
    <input id="em-subject" value="SP360 ERP — Notification"/>
  </div>
  <div class="form-field"><label>Message</label>
    <textarea id="em-body" rows="5">Dear ${esc(name)},\n\nThis is a notification from SP360 ERP.\n\nRegards,\nSP360 PMO Team</textarea>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="sendDirectEmail()">Send Email</button>
  </div>`);
}

async function sendDirectEmail(){
  const to=document.getElementById('em-to').value.trim();
  const subject=document.getElementById('em-subject').value.trim();
  const body=document.getElementById('em-body').value.trim();
  if(!to){showToast('Recipient required','error');return;}
  await dispatchEmail(to, subject, body, 'Email');
  closeModal();
}

async function sendAllEmail(emailList){
  const subject=document.getElementById('eall-subject').value.trim();
  const body=document.getElementById('eall-body').value.trim();
  closeModal();
  showToast('Sending to '+emailList.length+' users…');
  if(_edgeFnAvailable !== false){
    // Send individually via edge fn (Resend handles bulk)
    const sent = await sendViaEdge(emailList, subject, body);
    if(sent){ showToast('Sent to '+emailList.length+' users ✓'); return; }
  }
  // Fallback: mailto BCC
  fallbackMailto(emailList, subject, body);
  showToast('Email client opened with '+emailList.length+' recipients');
}

async function sendEmailNotification(type){
  const [projR, wfR, usersR] = await Promise.all([
    sb.from('projects').select('name,cpi,spi,status,ev,ac'),
    sb.from('workflow_items').select('ref_no,current_step,status').in('status',['pending','overdue']),
    sb.from('user_profiles').select('email,full_name,role').eq('is_active',true)
  ]);
  const projs=projR.data||[], wfs=wfR.data||[], users=usersR.data||[];
  const recipients=users.map(u=>u.email).filter(Boolean);
  const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  let subject='', body='';
  if(type==='pending_approvals'){
    const pending=wfs.filter(w=>w.status==='pending'||w.status==='overdue');
    subject=`⚡ ${pending.length} Pending Approvals — SP360 ERP — ${today}`;
    body=`Dear SP360 Team,\n\nThis is an automated notification from SP360 ERP v1.8.\n\nYou have ${pending.length} item(s) awaiting approval:\n\n`
      +pending.slice(0,10).map(w=>`  • ${w.ref_no} — ${w.current_step} [${w.status.toUpperCase()}]`).join('\n')
      +`\n\nPlease log in to SP360 ERP to take action:\nhttps://falconbold1999-ops.github.io/sp360-erp/\n\nRegards,\nSP360 PMO Team`;
  } else if(type==='weekly_evm'){
    const active=projs.filter(p=>isActiveProject(p));
    const totEV=active.reduce((s,p)=>s+Number(p.ev||0),0);
    const totAC=active.reduce((s,p)=>s+Number(p.ac||0),0);
    const portCPI=totAC>0?(totEV/totAC).toFixed(2):'—';
    subject=`📊 Weekly EVM Summary — SP360 ERP — ${today}`;
    body=`Dear SP360 Team,\n\nWeekly EVM Summary — ${today}\n\nPortfolio CPI: ${portCPI}\nActive Projects: ${active.length}\n\nProject Status:\n`
      +active.slice(0,8).map(p=>`  • ${p.name?.split('—')[0].trim()} | CPI: ${Number(p.cpi||1).toFixed(2)} | SPI: ${Number(p.spi||1).toFixed(2)}`).join('\n')
      +`\n\nFull report: https://falconbold1999-ops.github.io/sp360-erp/\n\nRegards,\nSP360 PMO Team`;
  } else if(type==='ceo_report'){
    subject=`👔 CEO Flash Report Ready — SP360 ERP — ${today}`;
    body=`Dear Team,\n\nThe CEO Flash Report for ${today} has been updated in SP360 ERP v1.8.\n\nLog in → CEO Report → Export PDF:\nhttps://falconbold1999-ops.github.io/sp360-erp/\n\nRegards,\nSP360 PMO Team`;
  }

  if(recipients.length===0){ showToast('No active users found','error'); return; }

  const label = type==='pending_approvals'?'Approvals Alert':type==='weekly_evm'?'Weekly EVM':'CEO Report';
  showToast(`Sending ${label} to ${recipients.length} users…`);
  const sent = await sendViaEdge(recipients, subject, body);
  if(sent){
    showToast(`${label} sent to ${recipients.length} users ✓`);
    await writeAudit('email_notifications',null,'EMAIL_SENT',null,{type,recipients:recipients.length,subject},`Notification sent via Edge Function`);
  } else {
    fallbackMailto(recipients, subject, body);
    showToast(`${label} — Email client opened`);
  }
}

async function openCreateBaselineModal(){
  const {data:projs}=await sb.from('projects')
    .select('id,project_no,name,start_date,end_date,bac,status')
    .in('status',ACTIVE_STATUSES)
    .order('project_no');

  // Load existing baselines
  const {data:baselines}=await sb.from('project_baselines')
    .select('project_id,version,version_label,bac,is_current,created_at')
    .order('created_at',{ascending:false})
    .limit(20);

  const blByProj={};
  (baselines||[]).forEach(b=>{
    if(!blByProj[b.project_id]) blByProj[b.project_id]=[];
    blByProj[b.project_id].push(b);
  });

  openModal('Baseline Management',`
  <div style="margin-bottom:12px;padding:8px 12px;background:#1E3A5F22;border-radius:6px;font-size:11px;color:var(--muted)">
    Create a baseline to enable time-phased PV calculation and accurate SPI reporting.
    Monthly PV is distributed linearly across the project duration.
  </div>
  <div class="form-row">
    <div class="form-field"><label>Project *</label>
      <select id="bl-proj" onchange="updateBaselineInfo()">
        <option value="">— Select Project —</option>
        ${(projs||[]).map(p=>`<option value="${p.id}" data-start="${p.start_date||''}" data-end="${p.end_date||''}" data-bac="${p.bac||0}">${esc(p.project_no)} — ${esc(p.name)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div id="bl-existing" style="margin-bottom:10px;font-size:10px;color:var(--muted)"></div>
  <div class="form-row">
    <div class="form-field"><label>Start Date *</label><input id="bl-start" type="date"/></div>
    <div class="form-field"><label>End Date *</label><input id="bl-end" type="date"/></div>
  </div>
  <div class="form-field"><label>Notes</label>
    <input id="bl-notes" placeholder="e.g. Original baseline — contract award date"/>
  </div>
  <div id="bl-preview" style="padding:8px 12px;background:#10B98111;border:1px solid #10B98133;border-radius:6px;font-size:11px;color:var(--muted);display:none"></div>
  <div class="modal-foot">
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveBaseline()">Create Baseline</button>
  </div>`);

  // Store baselines data for onchange
  window._blByProj=blByProj;
}

function updateBaselineInfo(){
  const sel=document.getElementById('bl-proj');
  const opt=sel.options[sel.selectedIndex];
  if(!opt||!opt.value) return;

  const start=opt.dataset.start;
  const end=opt.dataset.end;
  const bac=Number(opt.dataset.bac)||0;
  const projId=opt.value;

  if(start) document.getElementById('bl-start').value=start;
  if(end) document.getElementById('bl-end').value=end;

  // Show existing baselines
  const existing=(window._blByProj||{})[projId]||[];
  const existEl=document.getElementById('bl-existing');
  if(existing.length>0){
    existEl.innerHTML=`<div style="padding:6px 10px;background:#F97316
11;border:1px solid #F9741633;border-radius:5px">
      ⚠️ This project already has ${existing.length} baseline(s). Creating a new one will mark the current as superseded.
      <br>Current: <b>${esc(existing[0].version_label)}</b> — BAC: ${fmtKWD(existing[0].bac)}
    </div>`;
  } else {
    existEl.innerHTML='<div style="color:#10B981;font-size:10px">✓ No existing baseline — this will be the original baseline.</div>';
  }

  // Preview months
  const s=document.getElementById('bl-start').value;
  const e=document.getElementById('bl-end').value;
  if(s&&e){
    const months=Math.max(1,Math.round((new Date(e)-new Date(s))/(1000*60*60*24*30.5)));
    const monthly=bac/months;
    const prev=document.getElementById('bl-preview');
    prev.style.display='block';
    prev.innerHTML=`📐 BAC: ${fmtKWD(bac)} over <b>${months} months</b> = ${fmtKWD(monthly)}/month (linear distribution)`;
  }
}

async function saveBaseline(){
  const projId=document.getElementById('bl-proj').value;
  const start=document.getElementById('bl-start').value;
  const end=document.getElementById('bl-end').value;
  const notes=document.getElementById('bl-notes').value.trim();

  if(!projId||!start||!end){showToast('Project, Start Date and End Date required','error');return;}
  if(new Date(end)<=new Date(start)){showToast('End date must be after start date','error');return;}

  const btn=event?.target;
  if(btn){btn.disabled=true;btn.textContent='Creating…';}
  try{
    const {data,error}=await sb.rpc('create_project_baseline',{
      p_project_id: projId,
      p_start_date:  start,
      p_end_date:    end,
      p_notes:       notes||null
    });
    if(error){showToast('Error: '+error.message,'error');return;}
    if(!data?.ok){showToast('Failed: '+(data?.error||'Unknown'),'error');return;}
    showToast(`Baseline v${data.version} created — ${data.months} months ✓`);
    closeModal();
    loadProjects('baseline');
  }catch(e){
    showToast('Error: '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Create Baseline';}
  }
}

async function submitCO(coId){
  const {error}=await sb.from('change_orders').update({
    workflow_status:'submitted',
    submitted_by:currentUser.id,
    submitted_at:new Date().toISOString()
  }).eq('id',coId);

  await writeAudit('change_orders',coId,'CO_SUBMITTED',null,{workflow_status:'submitted'},'CO submitted for review');
  showToast('CO submitted for review');
  loadProjects('changeorders');
}

async function reviewCO(coId, action){
  const comments=prompt((action==='approve'?'Approval':'Rejection')+' comments (optional):');
  if(comments===null)return;
  const {data,error}=await sb.rpc('apply_co_to_baseline',{
    p_co_id:coId,
    p_reviewed_by:currentUser.id,
    p_action:action,
    p_comments:comments||null
  });
  if(error||!data?.success){showToast(error?.message||data?.error||'Review failed','error');return;}
  await writeAudit('change_orders',coId,action==='approve'?'CO_APPROVED':'CO_REJECTED',null,{action,comments},'CO reviewed');
  showToast(action==='approve'?'CO Approved — Baseline updated ✓':'CO Rejected');
  loadProjects('changeorders');
}

async function saveSnapshot(projId){
  const label=document.getElementById('f-snap-label').value.trim();
  const date=document.getElementById('f-snap-date').value;
  if(!label||!date){showToast('Label and date required','error');return;}
  const pv=Number(document.getElementById('f-snap-pv').value)||0;
  const ev=Number(document.getElementById('f-snap-ev').value)||0;
  const ac=Number(document.getElementById('f-snap-ac').value)||0;
  const spi=pv>0?Math.round(ev/pv*10000)/10000:null;
  const cpi=ac>0?Math.round(ev/ac*10000)/10000:null;
  const {error}=await sb.from('project_evm_snapshots').upsert({
    project_id:projId,snapshot_date:date,period_label:label,
    pv,ev,ac,spi,cpi,created_by:currentProfile?.id
  },{onConflict:'project_id,snapshot_date'});
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('project_evm_snapshots',projId,'SNAPSHOT_ADDED',null,{label,pv,ev,ac,spi,cpi},'EVM snapshot saved');
  showToast('Snapshot saved ✓');
  closeModal();loadProjects('scurve');
}

async function saveCO(){
  const proj=document.getElementById('f-coproj').value;
  const desc=document.getElementById('f-codesc').value.trim();
  const amt=Number(document.getElementById('f-coamt').value)||0;
  const date=document.getElementById('f-codate').value;
  if(!proj||!desc){showToast('Project and Description required','error');return;}
  // Generate CO number
  const {data:allCOs}=await sb.from('change_orders').select('co_no');
  const maxCO=(allCOs||[]).reduce((max,c)=>{const n=Number((c.co_no||'').split('-')[2]||0);return n>max?n:max;},0);
  const year=new Date().getFullYear();
  const co_no=`CO-${year}-${String(maxCO+1).padStart(3,'0')}`;
  const {error}=await sb.from('change_orders').insert({
    co_no,co_number:co_no,project_id:proj,
    co_type:document.getElementById('f-cotype').value,
    description:desc,amount:amt,
    cost_impact:amt,schedule_impact:0,
    title:desc,
    justification:document.getElementById('f-cojust').value||null,
    submitted_date:date,
    status:'pending',
    workflow_status:'draft',
    submitted_by:currentProfile?.id
  });
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('change_orders',null,'SUBMITTED',null,{co_no,description:desc,amount:amt},'Change order submitted');
  showToast('Change Order '+co_no+' submitted');
  closeModal();loadProjects('changeorders');
}

async function loadAudit(){
  const el=document.getElementById('page-audit');
  el.innerHTML=`<div class="loading">Loading…</div>`;
  const [{data:list},{data:profiles}]=await Promise.all([
    sb.from('audit_log').select('*').order('performed_at',{ascending:false}).limit(100),
    sb.from('user_profiles').select('id,full_name')
  ]);
  const L=list||[];
  const profMap=(profiles||[]).reduce((m,p)=>{m[p.id]=p.full_name;return m;},{});
  const fmtVals=v=>{if(!v)return'';try{const o=JSON.parse(v);return Object.entries(o).map(([k,val])=>`${k}: ${val}`).join(' | ');}catch{return v;}};
  el.innerHTML=`
  <div class="page-head"><div class="page-head-left"><span style="font-size:22px">📋</span><div><h1>Audit Trail</h1><div class="sub">Last 100 system actions · Who · What · When</div></div></div></div>
  <div class="card">
    <div class="sec-head"><div class="sec-title"><span>📋</span>System Activity Log</div></div>
    ${L.length===0?'<div class="empty">No audit records yet</div>':
    L.map(a=>`<div class="audit-row">
      <div class="audit-time">${new Date(a.performed_at).toLocaleString('en-GB')}</div>
      <div class="audit-action">${esc(a.action)}</div>
      <div style="color:var(--gold);font-size:11px;min-width:140px;font-weight:600">${esc(profMap[a.performed_by]||'System')}</div>
      <div class="audit-detail">${esc(a.entity_type)}${a.notes?' · '+esc(a.notes):''}${a.new_values?' → '+esc(fmtVals(a.new_values)):''}</div>
    </div>`).join('')}
  </div>`;
}

async function saveOpp(){
  const title=document.getElementById('f-title').value.trim();
  const client=document.getElementById('f-client').value.trim();
  if(!title||!client){showToast('Title and Client required','error');return;}
  // Generate opp_no
  const year=new Date().getFullYear();
  const {data:allOpps}=await sb.from('opportunities').select('opp_no').ilike('opp_no',`BD-${year}-%`);
  const maxSeq=(allOpps||[]).reduce((max,o)=>{const n=Number((o.opp_no||'').split('-')[2]||0);return n>max?n:max;},0);
  const seq=String(maxSeq+1).padStart(3,'0');
  const opp_no=`BD-${year}-${seq}`;
  const {error}=await sb.from('opportunities').insert({
    opp_no,title,client,
    department:document.getElementById('f-dept').value,
    est_value:Number(document.getElementById('f-value').value)||0,
    probability:Number(document.getElementById('f-prob').value)||50,
    status:'identified',
    deadline:document.getElementById('f-deadline').value||null,
    notes:document.getElementById('f-notes').value||null,
    created_by:currentProfile?.id
  });
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('opportunities',null,'CREATED',null,{opp_no,title},'New opportunity');
  showToast('Opportunity created');
  closeModal();loadBizdev();
}

  if(!proj||!gross||!date){showToast('Project, Amount and Date required','error');return;}
  const ret=Number(document.getElementById('f-iret').value)||0;
  const retAmt=Math.round(gross*ret/100*1000)/1000;
  const net=gross-retAmt;
  const type=document.getElementById('f-itype').value;
  const prefix=type==='client'?'INV-C':type==='supplier'?'INV-S':'INV-SC';
  const year=new Date().getFullYear();
  const {data:allInvs}=await sb.from('invoices').select('invoice_no').ilike('invoice_no',`${prefix}-${year}-%`);
  const maxInvSeq=(allInvs||[]).reduce((max,i)=>{const n=Number((i.invoice_no||'').split('-').pop()||0);return n>max?n:max;},0);
  const seq=String(maxInvSeq+1).padStart(3,'0');
  const invoice_no=`${prefix}-${year}-${seq}`;
  const {data:inv,error}=await sb.from('invoices').insert({
    invoice_no,project_id:proj,invoice_type:type,
    gross_amount:gross,vat_pct:0,vat_amount:0,
    retention_pct:ret,retention_amt:retAmt,net_amount:net,
    status:'draft',invoice_date:date,
    due_date:document.getElementById('f-idue').value||null,
    created_by:currentProfile?.id
  }).select().single();
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('invoices',inv?.id,'CREATED',null,{invoice_no,gross_amount:gross,net_amount:net,status:'draft'},'New invoice created');
  showToast('Invoice created — click Submit to start approval workflow');
  closeModal();loadFinance();
}

async function submitInvoice(invoiceId){
  if(!confirm('Submit this invoice for approval? This will start the PM Verification workflow.')) return;
  const btn=event?.target;
  if(btn){btn.disabled=true;btn.textContent='Submitting…';}
  try{
    const {data,error}=await sb.rpc('submit_invoice',{p_invoice_id:invoiceId});
    if(error){showToast('Error: '+error.message,'error');return;}
    if(!data?.ok){showToast('Submit failed: '+(data?.error||'Unknown error'),'error');return;}
    showToast(`Invoice submitted — Ref: ${data.ref_no} ✓`);
    loadFinance();
    loadWfBadge();
  }catch(e){
    showToast('Error: '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Submit ▶';}
  }
}

async function markInvoicePaid(invoiceId){
  if(!confirm('Mark this invoice as PAID?')) return;
  const {data:inv}=await sb.from('invoices').select('invoice_no,status').eq('id',invoiceId).single();
  const {error}=await sb.from('invoices').update({status:'paid',paid_date:new Date().toISOString().split('T')[0]}).eq('id',invoiceId);
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('invoices',invoiceId,'PAID',{status:inv?.status},{status:'paid'},'Invoice marked as paid');
  showToast('Invoice marked as paid ✓');
  loadFinance(curFinTab);
}

async function releaseRetention(invoiceId, retAmtStr){
  if(!confirm('Release retention of '+retAmtStr+' for this invoice?')) return;
  const {data:inv}=await sb.from('invoices').select('invoice_no,status').eq('id',invoiceId).single();
  const {error}=await sb.from('invoices').update({retention_released:true, retention_released_date:new Date().toISOString().split('T')[0]}).eq('id',invoiceId);
  if(error){showToast('Error: '+error.message,'error');return;}
  await writeAudit('invoices',invoiceId,'RETENTION_RELEASED',{retention_released:false},{retention_released:true,amount:retAmtStr},'Retention released');
  showToast('Retention released ✓');
  loadFinance('retention');
}

// Apply header row style (Navy bg + White bold text)
function xlHeader(row, bgColor){
  row.eachCell(cell=>{
    cell.fill   = { type:'pattern', pattern:'solid', fgColor: bgColor||XL.navy };
    cell.font   = XL.hFont(10);
    cell.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
    cell.border = XL.thinBorder;
  });
  row.height = 22;
}

// Apply data row style (alternating)
function xlDataRow(row, isAlt, ragVal){
  const bg = ragVal !== undefined
    ? (ragVal>=1 ? XL.lgreen : ragVal>=0.9 ? XL.lamber : XL.lred)
    : (isAlt ? XL.lgray : XL.white);
  row.eachCell({includeEmpty:true}, cell=>{
    cell.fill   = { type:'pattern', pattern:'solid', fgColor: bg };
    cell.border = XL.thinBorder;
    if(!cell.font) cell.font = XL.rFont(10);
  });
  row.height = 18;
}

// Title block — merged, Navy bg, Gold text
function xlTitleBlock(ws, title, subtitle, totalCols){
  // Row 1: Main title
  const t1 = ws.addRow([title]);
  ws.mergeCells(t1.number, 1, t1.number, totalCols);
  t1.getCell(1).fill   = { type:'pattern', pattern:'solid', fgColor: XL.navy };
  t1.getCell(1).font   = { name:'Calibri', size:14, bold:true, color: XL.gold };
  t1.getCell(1).alignment = { horizontal:'left', vertical:'middle', indent:1 };
  t1.height = 28;

  // Row 2: Subtitle
  const t2 = ws.addRow([subtitle]);
  ws.mergeCells(t2.number, 1, t2.number, totalCols);
  t2.getCell(1).fill   = { type:'pattern', pattern:'solid', fgColor: XL.navy };
  t2.getCell(1).font   = { name:'Calibri', size:9, bold:false, color: XL.white };
  t2.getCell(1).alignment = { horizontal:'left', vertical:'middle', indent:1 };
  t2.height = 16;

  // Row 3: spacer
  ws.addRow([]);
}

// KPI summary band
function xlKPIBand(ws, kpis, totalCols){
  // Labels row
  const lblRow = ws.addRow(kpis.map(k=>k[0]));
  lblRow.eachCell((cell,i)=>{
    cell.fill      = { type:'pattern', pattern:'solid', fgColor: XL.navy };
    cell.font      = { name:'Calibri', size:8, bold:false, color: XL.white };
    cell.alignment = { horizontal:'center', vertical:'middle' };
    cell.border    = XL.thinBorder;
  });
  lblRow.height = 14;

  // Values row
  const valRow = ws.addRow(kpis.map(k=>k[1]));
  valRow.eachCell((cell,i)=>{
    const kpi = kpis[i-1];
    cell.fill      = { type:'pattern', pattern:'solid', fgColor: XL.navy };
    cell.font      = { name:'Calibri', size:12, bold:true, color: kpi?.[2]||XL.gold };
    cell.alignment = { horizontal:'center', vertical:'middle' };
    cell.border    = XL.thinBorder;
  });
  valRow.height = 22;

  ws.addRow([]); // spacer
}

// Save workbook as download
async function xlSave(wb, filename){
  const buf  = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

// RAG color for cell
function xlRAGFill(val){
  const v=Number(val);
  return v>=1?XL.lgreen:v>=0.9?XL.lamber:XL.lred;
}
function xlRAGFont(val){
  const v=Number(val);
  const c=v>=1?'FF065F46':v>=0.9?'FF92400E':'FF991B1B';
  return { name:'Calibri', size:10, bold:true, color:{argb:c} };
}

  // ── SHEET 3: S-Curve Snapshots ──────────────────────────────
  const ws3 = wb.addWorksheet('S-Curve Snapshots', {
    views:[{state:'frozen',xSplit:0,ySplit:5}]
  });
  ws3.columns=[
    {key:'no',    width:14},{key:'name',  width:32},
    {key:'period',width:12},{key:'date',  width:14},
    {key:'pv',    width:14},{key:'ev',    width:14},
    {key:'ac',    width:14},{key:'spi',   width:10},
    {key:'cpi',   width:10}
  ];
  xlTitleBlock(ws3,'SP360 ERP v1.8 — S-Curve EVM Snapshots',
    `${month}  ·  Smart Projects 360  ·  Kuwait  ·  Confidential`,9);
  const hdr3=ws3.addRow(['Project No','Project Name','Period','Date',
    'PV (KWD)','EV (KWD)','AC (KWD)','SPI','CPI']);
  xlHeader(hdr3);
  let prevProj='';
  snaps.forEach((s,idx)=>{
    const projNo=s.project?.project_no||'';
    const isNewProj=projNo!==prevProj;
    prevProj=projNo;
    const row=ws3.addRow([
      projNo, s.project?.name||'', s.period_label||'', s.snapshot_date||'',
      Number(s.pv)||0, Number(s.ev)||0, Number(s.ac)||0,
      Number(s.spi)||0, Number(s.cpi)||0
    ]);
    xlDataRow(row, idx%2===1);
    ['E','F','G'].forEach(c=>{row.getCell(c).numFmt=XL.kwdK;row.getCell(c).alignment={horizontal:'right'};});
    ['H','I'].forEach(c=>{
      const v=row.getCell(c).value;
      row.getCell(c).numFmt=XL.idx;
      row.getCell(c).alignment={horizontal:'center'};
      row.getCell(c).font=xlRAGFont(v);
    });
    if(isNewProj){
      row.getCell('A').font={name:'Calibri',size:10,bold:true,color:XL.navy};
      row.getCell('B').font={name:'Calibri',size:10,bold:true,color:XL.navy};
    }
  });

  // ── SHEET 4: Trend Analysis ─────────────────────────────────
  const ws4 = wb.addWorksheet('Trend Analysis', {
    views:[{state:'frozen',xSplit:0,ySplit:5}]
  });
  ws4.columns=[
    {key:'no',    width:14},{key:'name',  width:32},
    {key:'status',width:13},{key:'pct',   width:9},
    {key:'cpi',   width:10},{key:'spi',   width:10},
    {key:'eac',   width:16},{key:'etc',   width:16},
    {key:'vac',   width:16},{key:'tcpi',  width:11},
    {key:'trend', width:18},{key:'rag',   width:10}
  ];
  xlTitleBlock(ws4,'SP360 ERP v1.8 — Trend Analysis & Forecasting',
    `${month}  ·  ETC = EAC−AC  ·  TCPI = (BAC−EV)÷(BAC−AC)  ·  ${today}`,12);
  const hdr4=ws4.addRow(['Project No','Project Name','Phase','%','CPI','SPI',
    'EAC (KWD)','ETC (KWD)','VAC (KWD)','TCPI','Performance Forecast','RAG']);
  xlHeader(hdr4);
  (projs||[]).filter(p=>isActiveProject(p)).forEach((p,idx)=>{
    const bT=Number(p.bac)||0, aT=Number(p.ac)||0, eT=Number(p.ev)||0;
    const cT=Number(p.cpi)||1;
    const eacT=cT>0?aT+(bT-eT)/cT:bT;
    const etcT=Math.max(eacT-aT,0);
    const vacT=bT-eacT;
    const wrT=bT-eT, brT=bT-aT;
    const tcpiT=wrT>0&&brT>0?wrT/brT:null;
    const rvT=Math.min(Number(p.cpi),Number(p.spi));
    let forecastT='Insufficient Data';
    if(cT>=1&&Number(p.spi)>=1)forecastT='On Track / Exceeding';
    else if(cT>=0.9&&Number(p.spi)>=0.9)forecastT='At Risk';
    else forecastT='Off Track — Needs Action';
    const row=ws4.addRow([
      p.project_no||'', p.name||'', p.status||'',
      Number(p.pct)||0, Number(p.cpi)||0, Number(p.spi)||0,
      Math.round(eacT), Math.round(etcT), Math.round(vacT),
      tcpiT!==null?Math.round(tcpiT*1000)/1000:null,
      forecastT,
      rvT>=1?'● Green':rvT>=0.9?'● Amber':'● Red'
    ]);
    xlDataRow(row, idx%2===1);
    ['D'].forEach(c=>{row.getCell(c).numFmt='0"%"';row.getCell(c).alignment={horizontal:'center'};});
    ['E','F'].forEach(c=>{
      const v=row.getCell(c).value;
      row.getCell(c).numFmt=XL.idx; row.getCell(c).alignment={horizontal:'center'};
      row.getCell(c).font=xlRAGFont(v);
      row.getCell(c).fill={type:'pattern',pattern:'solid',fgColor:xlRAGFill(v)};
    });
    ['G','H','I'].forEach(c=>{row.getCell(c).numFmt=XL.kwdK;row.getCell(c).alignment={horizontal:'right'};});
    const tCell=row.getCell('J');
    if(tcpiT!==null){
      tCell.numFmt='0.000'; tCell.alignment={horizontal:'center'};
      tCell.font={name:'Calibri',size:10,bold:true,color:tcpiT<=1?{argb:'FF065F46'}:tcpiT<=1.1?{argb:'FF92400E'}:{argb:'FF991B1B'}};
    }
    const vacCellT=row.getCell('I');
    vacCellT.font={name:'Calibri',size:10,bold:true,color:vacT>=0?{argb:'FF065F46'}:{argb:'FF991B1B'}};
    const ragCellT=row.getCell('L');
    ragCellT.fill={type:'pattern',pattern:'solid',fgColor:xlRAGFill(rvT)};
    ragCellT.font=xlRAGFont(rvT); ragCellT.alignment={horizontal:'center'};
    const fgCellT=row.getCell('K');
    fgCellT.font={name:'Calibri',size:10,bold:false,
      color:rvT>=1?{argb:'FF065F46'}:rvT>=0.9?{argb:'FF92400E'}:{argb:'FF991B1B'}};
  });

  await xlSave(wb, `SP360_Portfolio_EVM_${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('Portfolio Excel exported ✓');
}
